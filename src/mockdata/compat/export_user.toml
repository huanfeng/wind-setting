[[apps]]
process = "Weixin.exe"
first_show_mode = "instant"
unset = ["stale_probe_guard"]

[[apps]]
process = "EXCEL.EXE"
auto_pair = false

[[apps]]
process = "Dota2.exe"
disabled = true

[[apps]]
process = "Tabby.exe"
smart_method = "hold_composition"
first_show_mode = "fast"
initial_mode = "english"
initial_punct = "englsh"
caret_offset_y = 4
future_key = 3

[[apps]]
process = "Tabby.exe"
title = "SSH*"
auto_pair = true

[[apps]]
process = "*"
class = "MozillaWindowClass"
composition_placeholder = "zwsp"

[[initial_mode_scope]]
process = "explorer.exe"
classes = ["Progman", "WorkerW", "CabinetWClass"]

[[commit_newline]]
process = "Code.exe"
style = "keep"
