hint = "跟随光标=候选窗随输入位置移动；固定位置=停在屏幕固定处，不再随光标跑动。固定位置下直接拖动候选窗即可摆放，位置自动记住"
options = [
  { value = "follow_caret", label = "跟随光标" },
  { value = "fixed", label = "固定位置" },
]

[[items]]
key = "ui.candidate.offset_x"
group = "ui"
section = "候选窗口"
dialog_group = "cand_position"
type = "number"
label = "水平偏移"
hint = "在主题自带的定位基础上再微调候选窗的水平位置（正=向右）。仅「跟随光标」时生效"
min = -400
max = 400
enabled_when = "ui.candidate.position_mode == follow_caret"

[[items]]
key = "ui.candidate.offset_y"
group = "ui"
section = "候选窗口"
dialog_group = "cand_position"
type = "number"
label = "垂直偏移"
hint = "在主题自带的定位基础上再微调候选窗与光标的距离（正=远离光标：在下方时向下、翻到上方时向上）。仅「跟随光标」时生效"
min = -400
max = 400
enabled_when = "ui.candidate.position_mode == follow_caret"

[[items]]
key = "ui.candidate.first_show_mode"
group = "ui"
section = "候选窗口"
subsection = "显示"
dialog_hint = "首次显示时机、主题阴影、最小尺寸、双击截图"
dialog_title = "候选窗口高级设置"
type = "select"
label = "首次显示时机"
hint = "每串新输入的候选窗多快出现；应用给不出准确位置时，「快速」与「立即」会先按上次的位置显示。可在右键菜单里为单个应用单独设"
options = [
  { value = "fast", label = "快速显示" },
  { value = "wait", label = "等待精确坐标（较慢）" },
  { value = "instant", label = "立即显示（最快，可能抖动）" },
]

[[items]]
key = "ui.candidate.shadow"
group = "ui"
section = "候选窗口"
subsection = "显示"
dialog_extra_for = "ui.candidate.first_show_mode"
type = "select"
label = "主题阴影"
hint = "个别应用里候选窗周围出现多余的透明边、遮挡或显示异常时，可选「关闭」；关闭后窗口与内容等大，定位自动跟着调整，主题自带的位置偏移仍保留"
platform = "windows"
options = [
  { value = "follow", label = "跟随主题" },
  { value = "off", label = "关闭阴影" },
]

# 候选窗尺寸下限段：五项都是「窗口别缩得比这更小」的同一件事，且都不常改——摊在卡片上
# 五行连排会把「每页候选数」「定位方式」这些天天要动的项挤没。故卡片上只占一行
# 「候选窗口最小大小 …… [设置]」，五项全在对话框里（`dialog_title` 宿主 + `dialog_extra_for`
# 寄居，见 manifest.rs 的 build_grouped_dialog_row）。
#
# 宿主取**横排最小宽度**：它是对话框里第一个字段，也是最常配的一项——横排候选窗随候选
# 字数忽宽忽窄，"宽度别再跳"是这组设置最主要的用途。
#
# 下限量的是整个窗口（含翻页栏、编码栏），候选照常紧凑排列、凑不满的部分留空。
# 横排/竖排各配一套——两种排布的可用空间差一个数量级。
[[items]]
key = "ui.candidate.min_window_width_horizontal"
group = "ui"
section = "候选窗口"
subsection = "最小尺寸"
dialog_extra_for = "ui.candidate.first_show_mode"
type = "number"
label = "横排最小宽度（dp）"
hint = "窗口不足此宽时右侧留空，候选本身不拉伸；0 = 不限，跟随内容"
min = 0
max = 1200
# 单位「（dp）」写进 label 而不是 hint：对话框只有 460 宽，hint 会被截成一行（截断处
# 有 tooltip 兜底看全文），单位藏在截断后面等于没写——而不知道填的是像素还是字数，
# 这一格根本没法填。清单的 `unit` 字段目前无人消费（见 manifest.rs 的 MItem::unit）。

[[items]]
key = "ui.candidate.min_window_width_vertical"
group = "ui"
section = "候选窗口"
subsection = "最小尺寸"
type = "number"
label = "竖排最小宽度（dp）"
hint = "窗口不足此宽时右侧留空，候选高亮跟随窗口铺满；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_extra_for = "ui.candidate.first_show_mode"

[[items]]
key = "ui.candidate.min_window_height_horizontal"
group = "ui"
section = "候选窗口"
subsection = "最小尺寸"
type = "number"
label = "横排最小高度（dp）"
hint = "窗口不足此高时留空；窗口在光标上方时空白补在顶部；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_extra_for = "ui.candidate.first_show_mode"

[[items]]
key = "ui.candidate.min_window_height_vertical"
group = "ui"
section = "候选窗口"
subsection = "最小尺寸"
type = "number"
label = "竖排最小高度（dp）"
hint = "窗口不足此高时留空，翻页栏的出现消失一并吸收；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_extra_for = "ui.candidate.first_show_mode"

[[items]]
key = "ui.candidate.min_rows"
group = "ui"
section = "候选窗口"
subsection = "最小尺寸"
type = "number"
label = "竖排最小行数"
hint = "候选数不足时补透明空行以保持候选区高度；自动钳到每页候选数；0 = 不限。仅竖排生效"
min = 0
max = 9
dialog_extra_for = "ui.candidate.first_show_mode"

# 只认空白处（编码栏 / 内边距）：候选项按下即选词上屏、候选窗随之消失，落不到第二下。
# macOS 候选窗由 .app 自绘，没有接这条鼠标交互，故限 Windows。
[[items]]
key = "ui.candidate.double_click_screenshot"
group = "ui"
section = "候选窗口"
subsection = "其它"
dialog_extra_for = "ui.candidate.first_show_mode"
type = "toggle"
label = "双击候选窗截图"
hint = "双击候选窗的编码栏或空白处，把候选窗当前画面复制到剪贴板；点候选词仍是选词"
platform = "windows"

# ── 候选排版（编码栏位置、横竖排、上方时的顺序）──
[[items]]
key = "ui.candidate.preedit_display"
group = "ui"
section = "候选排版"
type = "select"
label = "编码显示方式"
hint = "编码（组合区）的显示位置；「内嵌应用光标处」时候选窗不显示编码栏，另两种依赖候选窗、在全屏游戏等宿主自绘候选的场合自动按内嵌显示"
options = [
  { value = "app_inline", label = "内嵌应用光标处" },
  { value = "candidate_top", label = "候选窗顶部独立栏" },
  { value = "candidate_inline", label = "候选窗首单元内联" },
]

[[items]]
key = "ui.candidate.layout"
group = "ui"
section = "候选排版"
type = "segmented"
label = "候选窗排列"
hint = "候选词的排列方式"
[[items.options]]
value = "horizontal"
label = "横排"
[[items.options]]
value = "vertical"
label = "竖排"

[[items]]
key = "ui.candidate.max_chars"
group = "ui"
section = "候选排版"
type = "number"
label = "候选文本最大字数"
hint = "候选文本超过此字数时截断并追加省略号；0 = 不限。只管候选词本身，注释的字数上限在下方「候选注释」的设置里"
min = 0
max = 64

[[items]]
key = "ui.candidate.flip_when_above"
group = "ui"
section = "候选排版"
subsection = "候选窗在光标上方时"
dialog_hint = "候选窗在光标上方时的排列、翻页栏与页码"
dialog_title = "候选排版高级设置"
type = "toggle"
label = "反转候选顺序"
hint = "候选窗显示在光标上方时，反转候选项的排列顺序（使第一候选靠近光标）；可与「编码栏置底」叠加。仅竖排 +「跟随光标」定位下生效"

[[items]]
key = "ui.candidate.swap_preedit_when_above"
group = "ui"
section = "候选排版"
subsection = "候选窗在光标上方时"
dialog_extra_for = "ui.candidate.flip_when_above"
type = "toggle"
label = "编码栏置底"
hint = "候选窗显示在光标上方时，将编码栏与候选栏上下调换，使编码栏沉到底部贴近光标。仅「跟随光标」定位下生效"

[[items]]
key = "ui.candidate.pager_in_preedit"
group = "ui"
section = "候选排版"
subsection = "翻页栏"
dialog_extra_for = "ui.candidate.flip_when_above"
type = "toggle"
label = "并入编码栏"
hint = "将翻页栏右对齐显示在编码所在行（竖排可省一行）；「编码显示方式」取「候选窗顶部独立栏」或「候选窗首单元内联」时均生效，横排下无影响"

[[items]]
key = "ui.candidate.pager_bar_display"
group = "ui"
section = "候选排版"
subsection = "翻页栏"
dialog_extra_for = "ui.candidate.flip_when_above"
type = "select_by_layout"
label = "翻页栏显示"
hint = "覆盖主题配置中翻页栏的显示方式；隐藏时整个翻页栏（含箭头）不渲染。横排、竖排可分别设——横排的翻页栏要挤占候选共享的那一行，竖排多一行代价小"
# 加宽到装得下最长的跟随档「跟随主题（大于一页时显示）」，200 会折成两行。
width = 232
# 空值档 = 跟随主题（R8.2），渲染时文案换成「跟随主题（当前主题的档位）」。
follow = "theme"
options = [
  { value = "", label = "跟随主题" },
  { value = "hide", label = "隐藏" },
  { value = "auto", label = "大于一页时显示" },
  { value = "always", label = "总是显示" },
]

[[items]]
key = "ui.candidate.page_number_display"
group = "ui"
section = "候选排版"
subsection = "翻页栏"
dialog_extra_for = "ui.candidate.flip_when_above"
type = "select_by_layout"
label = "显示页码"
hint = "翻页栏可见时，是否显示页码文字；横排、竖排可分别设"
# 与翻页栏同宽，两行的横 / 竖下拉上下对齐。
width = 232
follow = "theme"
options = [
  { value = "", label = "跟随主题" },
  { value = "show", label = "显示" },
  { value = "hide", label = "隐藏" },
]

# ── 候选标注（附在候选项上的文字：注释、序号、命令前缀）──
# 总开关置于卡片首行，只有「候选注释」（模板对话框）随它置灰。不挂的：
# - 序号标签、命令栏前缀：与注释无关；
# - 「自动使用词库自带的注释」「注释词库」：它们供 `${dict}` 查询，悬停提示的段也用
#   （设置端自带的「词库注释」悬停预设就是），而 enabled_when 表达不了
#   「注释开 或 悬停开」这种或条件——挂上只看注释开关，会在悬停仍要用时把它们误置灰。
[[items]]
key = "ui.candidate.comment_enabled"
group = "ui"
section = "候选标注"
type = "toggle"
label = "显示候选注释"
hint = "候选词右侧的编码、注音等小字；用不到可关掉以省内存"

# 候选注释段（候选右侧的小字）：卡片上只占一行「候选注释 …… [设置]」，三个字段与模板参考
# 全在对话框里（专用 builder，见 manifest.rs 的 COMMENT_HOST_KEY）。
# 宿主取**横排**模板：它是对话框里第一个出现的字段，而横排宽度由全部候选共享、最需斟酌。
# 卡片行的 hint 保持一句话——模板语法属于对话框里的事，摊在卡片上没人看得完。
[[items]]
key = "ui.candidate.comment_template_horizontal"
group = "ui"
section = "候选标注"
gate_key = "ui.candidate.comment_enabled"
gate_soft = true
type = "dialog_button"
label = "候选注释"
hint = "候选词右侧小字的内容与最大字数，横排、竖排可分别设置"

[[items]]
key = "ui.candidate.comment_template_vertical"
group = "ui"
section = "候选标注"
type = "string"
label = "竖排注释"
hint = "竖排候选窗每行独占一行，可放较长的注音或字根；换行写 \\n"
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.candidate.comment_above"
group = "ui"
section = "候选标注"
type = "toggle"
label = "注释首行显示在候选上方"
hint = "开启后，模板里第一个换行（\\n）之前的内容显示在候选上方一行，其余仍在候选右侧；换行要写在 { … } 之外。"
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.candidate.comment_max_chars_horizontal"
group = "ui"
section = "候选标注"
type = "number"
label = "横排最大字数"
hint = "超过此字数时截断并加省略号；0 = 不限"
min = 0
max = 64
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.candidate.comment_max_chars_vertical"
group = "ui"
section = "候选标注"
type = "number"
label = "竖排最大字数"
hint = "竖排每行独占，通常可比横排放宽；0 = 不限（行宽放不下时注释仍会截断，先保候选词完整）"
min = 0
max = 64
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.candidate.auto_comment_dicts"
group = "ui"
section = "候选标注"
type = "toggle"
label = "自动使用词库自带的注释"
hint = "词库声明 comment 列时将其作为 ${dict} 的查询源，供注释模板与悬停提示使用；可在「注释词库」中单独启停与排序"

[[items]]
key = "ui.comment_dicts"
group = "ui"
section = "候选标注"
type = "dialog_button_comment_dicts"
label = "注释词库"
hint = "供注释模板与悬停提示中的 ${dict} 变量查询；词库文件放在 schemas/comments/ 下"

[[items]]
key = "ui.candidate.index_labels"
group = "ui"
section = "候选标注"
type = "dialog_button"
label = "自定义序号标签"
hint = "为序号 1-10 自定义标签（每框一个完整标签，可多字符）；在对话框中逐框填写，留空用默认 1-9"

# 注：ui.candidate.custom_x / custom_y（固定位置坐标）刻意不在此暴露——与 ui.status 同一决策：
# 固定位置由「拖动候选窗」直接设定并自动落盘，手填屏幕绝对坐标既不直观、又与拖动结果互相覆盖。
# 主流输入法（搜狗、Google 拼音）同样只提供「是否跟随光标」开关，不提供坐标输入。
# 尚未拖动过时（坐标为 0,0）候选窗落在屏幕下方居中的默认锚点。配置键仍在 config.toml 中保留。

# 注：input.cmdbar.enabled（命令栏开关）不在设置端暴露——命令栏始终开启（core 默认 true），
# 不提供关闭入口；故仅保留前缀配置。
[[items]]
key = "input.cmdbar.candidate_prefix"
group = "ui"
section = "候选标注"
type = "string"
label = "命令栏候选前缀"
hint = "命令候选前的提示符号"

# ── 候选项提示 ──
# 总开关置于卡片首行，其余各行随它置灰。
[[items]]
key = "ui.tooltip.enabled"
group = "ui"
section = "候选项提示"
opens_dialog = "tooltip"
type = "toggle"
label = "悬停提示"
hint = "鼠标停在候选上时弹出的编码、拼音等提示；用不到可关掉以省内存"

[[items]]
key = "ui.tooltip.delay"
group = "ui"
section = "候选项提示"
dialog_group = "tooltip"
type = "number"
label = "悬停延时"
hint = "鼠标停留在候选上多久后弹出提示框（毫秒）；越大越不易误触"
enabled_when = "ui.tooltip.enabled == true"
min = 0
max = 2000
step = 50
unit = "ms"

# 提示内容：有序段列表（StructList），每段 = 段名 + 内容模板，整表读写走专用对话框。
# 取代了旧的 code_enabled / pinyin_enabled / pinyin_heteronyms / pinyin_max_readings /
# chaizi_enabled / debug_enabled 六个开关（core 加载时迁移，设计见 core 仓
# docs/design/candidate-tooltip-sections.md）。
[[items]]
key = "ui.tooltip.sections"
group = "ui"
section = "候选项提示"
type = "dialog_button_tooltip_sections"
indent = false
label = "提示内容"
hint = "悬停提示由若干段自上而下组成，每段可启停、排序、改写内容，或按预设添加"
enabled_when = "ui.tooltip.enabled == true"

[[items]]
key = "ui.tooltip.max_chars"
group = "ui"
section = "候选项提示"
dialog_group = "tooltip"
type = "number"
label = "单行最大字数"
hint = "超出部分以省略号截断；0 = 不限。复制、上屏取的仍是完整内容。只管悬停提示，候选右侧注释的字数在「外观 → 候选注释」里设"
min = 0
max = 2000
step = 10
enabled_when = "ui.tooltip.enabled == true"

[[items]]
key = "ui.tooltip.wrap_width"
group = "ui"
section = "候选项提示"
dialog_group = "tooltip"
type = "number"
label = "折行宽度"
hint = "一行超过这个宽度就换行，汉字计 2、字母计 1；0 = 不折行"
min = 0
max = 200
step = 2
enabled_when = "ui.tooltip.enabled == true"

# ── 展开候选（卷轴）──
# 总开关在卡片首行，其余细节进它的扩展设置对话框并随它置灰（同「候选项提示」）。
# 核心设计见 core 仓 docs/design/candidate-grid-expand.md。
[[items]]
key = "ui.candidate.grid_expand"
group = "ui"
section = "展开候选"
opens_dialog = "grid"
type = "toggle"
label = "翻页时展开候选"
hint = "候选多于一页时，按翻页键把候选窗原地展开成多行，一行就是一页；方向键在各行间移动，数字键选高亮行，Esc 先收起。仅横排生效"

[[items]]
key = "ui.candidate.grid_rows"
group = "ui"
section = "展开候选"
dialog_group = "grid"
type = "number"
label = "可见行数"
hint = "展开后一屏显示几行，翻页键一次滚动这么多行"
enabled_when = "ui.candidate.grid_expand == true"
min = 2
max = 10

[[items]]
key = "ui.candidate.grid_cell_max_chars"
group = "ui"
section = "展开候选"
dialog_group = "grid"
type = "number"
label = "每格最多字数"
hint = "展开后各列对齐，长词会撑宽整列，超出部分以省略号截断，悬停提示里可看全文；0 = 只受「候选文本最大字数」约束"
enabled_when = "ui.candidate.grid_expand == true"
min = 0
max = 64

[[items]]
key = "ui.candidate.grid_index_fill"
group = "ui"
section = "展开候选"
dialog_group = "grid"
type = "select"
label = "序号顺延"
hint = "一行用不完 1~0 十个数字键时，序号怎么往下一行顺延；数字键跟着序号选"
enabled_when = "ui.candidate.grid_expand == true"
options = [
  { value = "rows", label = "只补整行" },
  { value = "cells", label = "逐格编满十个" },
  { value = "off", label = "只编高亮行" },
]

[[items]]
key = "ui.candidate.grid_categories"
group = "ui"
section = "展开候选"
dialog_group = "grid"
type = "checkbox_group"
label = "分类标签"
hint = "展开后在候选上方显示的分类，按 Tab / Shift+Tab 或点击切换；「生僻」按常用字表划分；勾选不足两个时不显示标签栏"
enabled_when = "ui.candidate.grid_expand == true"
[[items.options]]
value = "all"
label = "全部"
[[items.options]]
value = "single"
label = "单字"
[[items.options]]
value = "phrase"
label = "词组"
[[items.options]]
value = "rare"
label = "生僻"
[[items.options]]
value = "symbol"
label = "符号"

[[items]]
key = "ui.candidate.grid_tooltip_follows_highlight"
group = "ui"
section = "展开候选"
dialog_group = "grid"
type = "toggle"
label = "提示跟随高亮"
hint = "鼠标不在候选窗上时，悬停提示也跟着键盘高亮的那一格显示，贴在候选窗外侧"
enabled_when = "ui.candidate.grid_expand == true"

# ── 状态提示（行为/位置类；纯视觉如颜色/字号/透明度/圆角由主题 theme.toml 处理，不在此）──
[[items]]
key = "ui.status.enabled"
group = "ui"
section = "状态提示"
opens_dialog = "status"
type = "toggle"
label = "状态提示气泡"
hint = "切换输入状态时显示提示气泡"

# ── 模式指示 ──
[[items]]
key = "ui.mode_indicator.style"
group = "ui"
section = "状态提示"
type = "select"
label = "模式指示样式"
hint = "进入临拼/双拼/快符/英文等模式时的标识；短称即 拼/双/快/英/符"
options = [
  { value = "short", label = "短称" },
  { value = "full", label = "全称" },
  { value = "none", label = "不显示" },
]

[[items]]
key = "ui.status.display_mode"
group = "ui"
section = "状态提示"
subsection = "显示"
dialog_group = "status"
type = "select"
label = "显示模式"
hint = "临时显示在切换时闪现后自动消失，常驻显示在有输入焦点时始终显示；右键气泡可快速切换"
enabled_when = "ui.status.enabled == true"
options = [
  { value = "temp", label = "临时显示" },
  { value = "always", label = "常驻显示" },
]

[[items]]
key = "ui.status.show_on_focus"
group = "ui"
section = "状态提示"
subsection = "显示"
dialog_group = "status"
type = "toggle"
label = "焦点切换时显示"
hint = "切换到别的输入框时也提示一次当前状态；跟随光标定位下，取不到精确插入点的应用不显示，避免弹在错误位置"
# 常驻显示本就在获焦时显示，此项对它没有额外效果，故仅在临时显示下可用（与「显示时长」同条件）。
enabled_when = "ui.status.enabled == true && ui.status.display_mode == temp"

[[items]]
key = "ui.status.duration"
group = "ui"
section = "状态提示"
subsection = "显示"
dialog_group = "status"
type = "number"
label = "显示时长"
hint = "气泡停留时间；鼠标悬停、拖动或打开右键菜单期间会顺延，不会中途消失"
min = 0
max = 5000
unit = "ms"
enabled_when = "ui.status.enabled == true && ui.status.display_mode == temp"

[[items]]
key = "ui.status.items"
group = "ui"
section = "状态提示"
subsection = "显示"
dialog_group = "status"
type = "checkbox_group"
label = "显示内容"
hint = "勾选状态气泡里显示哪些内容；全部取消则不显示气泡"
enabled_when = "ui.status.enabled == true"
[[items.options]]
value = "schema"
label = "输入方案"
[[items.options]]
value = "punct"
label = "标点状态"
[[items.options]]
value = "full_width"
label = "全半角状态"
[[items.options]]
value = "s2t"
label = "简繁状态"
[[items.options]]
value = "caps"
label = "大写锁定"

[[items]]
key = "ui.status.schema_name_style"
group = "ui"
section = "状态提示"
subsection = "显示"
dialog_group = "status"
type = "select"
label = "方案名显示样式"
hint = "上方勾选「输入方案」后生效；图标短称取方案 icon_label，无则回退全名"
enabled_when = "ui.status.enabled == true && ui.status.items contains schema"
options = [
  { value = "full", label = "全名" },
  { value = "short", label = "图标短称" },
]

[[items]]
key = "ui.status.position_mode"
group = "ui"
section = "状态提示"
subsection = "位置"
dialog_group = "status"
type = "select"
label = "定位方式"
hint = "固定位置下可直接拖动气泡摆放，右键气泡可切换定位方式或恢复默认位置"
enabled_when = "ui.status.enabled == true"
options = [
  { value = "follow_caret", label = "跟随光标" },
  { value = "fixed", label = "固定位置" },
  { value = "screen_center", label = "屏幕中央" },
  { value = "screen_top_left", label = "屏幕左上角" },
  { value = "screen_top_right", label = "屏幕右上角" },
  { value = "screen_bottom_left", label = "屏幕左下角" },
  { value = "screen_bottom_right", label = "屏幕右下角" },
  { value = "window_center", label = "窗口中央" },
  { value = "window_bottom_left", label = "窗口左下角" },
]

# 锚点文案与 core 右键菜单「应用独立配置 → 状态提示位置」逐字一致（handle_menu.rs 的
# status_anchor_label）。「屏幕」= 当前窗口所在显示器，「窗口」= 当前窗口的边框。
[[items]]
key = "ui.status.fallback_position"
group = "ui"
section = "状态提示"
subsection = "位置"
dialog_group = "status"
type = "select"
label = "坐标不可用时"
hint = "仅在「跟随光标」下生效：应用报不出光标位置（如部分设计软件）时气泡显示在哪里；「上次位置」即最近一次拿到光标的地方"
enabled_when = "ui.status.enabled == true && ui.status.position_mode == follow_caret"
options = [
  { value = "last", label = "上次位置" },
  { value = "hide", label = "不显示" },
  { value = "screen_center", label = "屏幕中央" },
  { value = "screen_top_left", label = "屏幕左上角" },
  { value = "screen_top_right", label = "屏幕右上角" },
  { value = "screen_bottom_left", label = "屏幕左下角" },
  { value = "screen_bottom_right", label = "屏幕右下角" },
  { value = "window_center", label = "窗口中央" },
  { value = "window_bottom_left", label = "窗口左下角" },
]

[[items]]
key = "ui.status.offset_x"
group = "ui"
section = "状态提示"
subsection = "位置"
type = "number"
label = "水平偏移"
hint = "相对光标下方（左边缘对齐光标）的水平偏移（像素，正=右）"
min = -400
max = 400
enabled_when = "ui.status.position_mode == follow_caret"
dialog_group = "status"

[[items]]
key = "ui.status.offset_y"
group = "ui"
section = "状态提示"
subsection = "位置"
type = "number"
label = "垂直偏移"
hint = "相对光标下方的垂直偏移（像素，正=下）"
min = -400
max = 400
enabled_when = "ui.status.position_mode == follow_caret"
dialog_group = "status"

# 注：ui.status.custom_x / custom_y（固定位置坐标）刻意不在此暴露——固定位置由「拖动气泡」
# 直接设定，右键菜单「固定位置」开关会以气泡当前实际位置落盘，「恢复默认位置」可复位。
# 让用户手填屏幕绝对坐标既不直观、又与拖动结果互相覆盖。配置键本身仍在 config.toml 中保留。

# ── 工具栏 ──
[[items]]
key = "ui.toolbar.visible"
group = "ui"
section = "工具栏"
type = "toggle"
label = "显示工具栏"
# 文案刻意写成平台中立：本项在 Windows 上控制可拖动的浮动工具栏，在 macOS 上控制
# 菜单栏指示器——两者形态不同但语义一致（“输入法的常驻状态显示”），故不提“可拖动”
# 之类只在一边成立的描述。清单当前不支持分平台文案，写通用的即可。
hint = "常驻显示输入法当前状态（中英、全半角、标点、方案）"

[[items]]
key = "ui.toolbar.vertical"
group = "ui"
section = "工具栏"
type = "toggle"
label = "纵向排列"
hint = "工具栏竖着摆放；适合把它靠在屏幕左右两侧"
platform = "windows, linux"

# 带 platform = "windows, linux" 的几项：macOS 用菜单栏指示器，既不是浮动窗口也无法排列/自动隐藏。
# （ui.toolbar.visible 不在此列——它在 macOS 上控制指示器的显示与否，是有落点的。）
# fullscreen_watch 仍只限 windows：它开关的是 Windows 的定时轮询，Linux 没有对应机制。
[[items]]
key = "ui.toolbar.hide_in_fullscreen"
group = "ui"
section = "工具栏"
dialog_hint = "全屏时、英文状态时或闲置一段时间后隐藏工具栏"
dialog_title = "自动隐藏"
type = "toggle"
label = "全屏时隐藏工具栏"
hint = "当前台应用进入全屏（游戏、视频、演示等）时自动隐藏工具栏。Linux 的 Wayland 会话拿不到前台全屏状态，只是把工具栏放在全屏应用之下，效果是近似的"
platform = "windows, linux"

# 受 hide_in_fullscreen 门控：那项关着时「怎么发现全屏」无从谈起。引用同卡片内的 key，
# 渲染上自动成为它的从属行。
[[items]]
key = "ui.toolbar.fullscreen_watch"
group = "ui"
section = "工具栏"
dialog_extra_for = "ui.toolbar.hide_in_fullscreen"
type = "toggle"
label = "主动检测全屏状态"
hint = "定期主动查询前台是否全屏。关掉后，像在输入框里按 F11 这种不伴随焦点切换的全屏，输入法收不到通知，工具栏不会自动隐藏"
enabled_when = "ui.toolbar.hide_in_fullscreen == true"
platform = "windows"

# 论坛 t167。「英文状态」= 中英切到英文；临时英文 / 大写锁定仍算中文态。
[[items]]
key = "ui.toolbar.hide_in_english"
group = "ui"
section = "工具栏"
dialog_extra_for = "ui.toolbar.hide_in_fullscreen"
type = "toggle"
label = "英文状态时隐藏工具栏"
hint = "切换到英文时隐藏工具栏，切回中文即重新显示"
platform = "windows, linux"

# 显示哪些格 + 顺序。用 ordered_pairs 而非 checkbox_group：core 侧**数组顺序即渲染顺序**，
# 而 checkbox_group 恒按声明序写回，会静默改写用户拖出来的顺序（config-design-rules §R3）。
# value = core 的条目键，声明序 = 出厂顺序，须与主仓 TOOLBAR_ITEM_KEYS 一致。
[[items]]
key = "ui.toolbar.items"
group = "ui"
section = "工具栏"
type = "dialog_button_ordered_pairs"
label = "显示内容"
hint = "工具栏上显示哪些内容、按什么顺序；按住行首手柄上下拖动即可调整"
platform = "windows, linux"
options = [
  { value = "mode", label = "中英 / 方案", hint = "显示当前是中文还是英文，中文时显示方案标签（拼、五等）；点击切换中英，右键选方案，中键切换到下一个方案" },
  { value = "punct", label = "标点", hint = "中文标点还是英文标点；点击切换，右键可一并调整全半角与简繁" },
  { value = "full_width", label = "全 / 半角", hint = "满月＝全角、弯月＝半角；点击切换，右键可一并调整标点与简繁" },
  { value = "s2t", label = "简 / 繁", hint = "简入繁出的开关，点击切换；出厂关着" },
  { value = "t2s", label = "繁 → 简", hint = "繁入简出的开关，点击切换；格里恒显「简」，亮起表示正在转换。出厂关着" },
  { value = "soft_keyboard", label = "软键盘", hint = "键盘按钮，点击开关软键盘面板；右键可直接选一种键盘" },
  { value = "settings", label = "设置", hint = "齿轮按钮，点击打开功能菜单。隐藏它也不影响使用——右键工具栏任意位置同样能打开菜单" },
]

[[items]]
key = "ui.toolbar.auto_hide"
group = "ui"
section = "工具栏"
dialog_extra_for = "ui.toolbar.hide_in_fullscreen"
type = "toggle"
label = "自动隐藏工具栏"
hint = "工具栏显示一段时间无交互后淡出隐藏；鼠标悬停不隐藏，切换中英等状态变化时重新显示"
platform = "windows, linux"

[[items]]
key = "ui.toolbar.auto_hide_delay"
group = "ui"
section = "工具栏"
dialog_extra_for = "ui.toolbar.hide_in_fullscreen"
type = "number"
label = "自动隐藏延时"
hint = "工具栏显示多久后开始淡出（秒）"
min = 1
max = 60
unit = "s"
enabled_when = "ui.toolbar.auto_hide == true"
platform = "windows, linux"

# 论坛 t167「假隐藏」：淡出后窗口仍留在原位（几乎透明、可命中），悬停即唤回。
[[items]]
key = "ui.toolbar.auto_hide_hover_reveal"
group = "ui"
section = "工具栏"
dialog_extra_for = "ui.toolbar.hide_in_fullscreen"
type = "toggle"
label = "悬停原位时重新显示"
hint = "隐藏后工具栏仍占着原来的位置，鼠标移过去就重新显示、移开后再次淡出；关掉则彻底隐藏，只在切换中英等状态变化时出现"
enabled_when = "ui.toolbar.auto_hide == true"
platform = "windows, linux"

# 非中文态的模式主字。中文态的主字不在这里——它是**方案**的属性（方案文件 [schema]
# icon_label），一个全局项表达不了「每个方案各显示什么」。
#
# 出厂「英」既给英文半角态、也是英文方案的标签，两者只靠颜色区分，辨识度不高；
# 把半角态改成 En 之类即可拉开距离（论坛 #154）。
[[items]]
key = "ui.labels.english"
group = "ui"
section = "工具栏"
dialog_hint = "英文半角、大写锁定时工具栏上显示的字"
dialog_title = "状态主字"
type = "string"
label = "英文半角主字"
hint = "左右 Shift 切出的英文半角态，在工具栏（Windows 上还有任务栏图标）显示的字；最多 2 个字符，留空用「英」"
platform = "windows, linux"

[[items]]
key = "ui.labels.caps_lock"
group = "ui"
section = "工具栏"
dialog_extra_for = "ui.labels.english"
type = "string"
label = "大写锁定主字"
hint = "大写锁定打开时显示的字；最多 2 个字符，留空用「A」"
platform = "windows, linux"

# 宿主行 = 角标总开关下拉 + 「设置…」按钮，尺寸与不透明度进分组对话框；
# 规则表另起一行（它自己就是个带增删的列表，塞不进分组对话框）。
# 宿主行必须带一个值控件（build_dialog_group_row 恒调 build_control），做不出纯标签+按钮
# 的行；总开关是这组里最常改的一项，故由它当宿主。
[[items]]
key = "ui.langbar.badge"
group = "ui"
section = "任务栏图标"
type = "select"
label = "状态角标"
hint = "在任务栏图标的角上叠加状态标记；关掉则全不显示"
options = [
  { value = "none", label = "不显示" },
  { value = "corner", label = "角标" },
]
opens_dialog = "langbar_badge"
platform = "windows"

[[items]]
key = "ui.langbar.badge_scale"
group = "ui"
section = "任务栏图标"
type = "slider"
label = "角标大小"
hint = "所有角标的大小倍率；单条可在规则里再调"
min = 0.1
max = 3.0
step = 0.1
dialog_group = "langbar_badge"
platform = "windows"

# 步长 0.02 而不是 0.05 / 0.1：出厂值 0.88 必须落在格子上（0.3 + 0.02×29），
# 否则从默认值点一下就跳到一个"回不去"的值。
# ⚠️ hint 必须一行装得下（约 24 字），超出会被省略号截掉——而末端 1.0 的跳变
# （变实心并挖字）正是调之前必须知道的一句，被截等于没写。
[[items]]
key = "ui.langbar.badge_alpha"
group = "ui"
section = "任务栏图标"
type = "slider"
label = "角标透明度"
hint = "越小越透；调到 1 变实心，并挖掉周围一圈主字"
min = 0.3
max = 1.0
step = 0.02
dialog_group = "langbar_badge"
platform = "windows"

[[items]]
key = "ui.langbar.badges"
group = "ui"
section = "任务栏图标"
type = "dialog_button_langbar_badges"
indent = false
label = "角标规则"
hint = "哪些状态画角标、画在哪个角、什么颜色"
enabled_when = "ui.langbar.badge != none"
platform = "windows"

# 任务栏图标主字颜色：用户值 > 主题值 > 内置（浅黑深白），四格各自回落（R3「外观覆盖主题」）。
# 卡片一行（四枚缩略色样 + [设置]），对话框里 2×2 取色（windui color_picker，带透明度）。
# 宿主挂在 cn_light 上，另外三键**没有自己的清单项**，登记在 capabilities.rs 的
# UNCOVERED_BY_DESIGN（与 `ui.toolbar.buttons` 同一先例：同一对话框一并读写）。不用
# R6 那两种折叠机制：「宿主行 + 附属对话框」要一个带值控件当宿主，而这组四键平级，
# 硬挑一格放卡片上就不对称，再造一个开关当宿主是 R3 禁止的「开关 + 值」双写法；
# `dialog_extra_for` 已冻结。四格平铺四行则是这次要消掉的「大量同类控件」。
[[items]]
key = "ui.langbar.text_color_cn_light"
group = "ui"
section = "任务栏图标"
type = "dialog_button_langbar_text_colors"
label = "主字颜色"
hint = "中、英两字在浅色/深色任务栏上的颜色，默认跟随主题"
platform = "windows"

# ═══════════════════════════ 常规（并入「输入」页首「默认状态」）═══════════════════════════
# 本段在文件里排最后只影响 `manifest.order`（搜索结果次序），不影响页面：
# `input_page` 把 general 整批排在输入页最前，与二级导航一致。
[[items]]
key = "input.default.state_scope"
group = "general"
section = "默认状态"
type = "select"
label = "中英状态作用域"
hint = "全局统一：所有应用共享同一中英状态；按应用独立：每个应用各自记忆中英文（适合游戏等需保持英文的场景，重启输入法后重置）"
options = [
  { value = "global", label = "全局统一" },
  { value = "app", label = "按应用独立" },
]

[[items]]
key = "input.default.remember_last_state"
group = "general"
