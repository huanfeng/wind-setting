width = 210
enabled_when = "input.url.enabled == true"
options = [
  { value = "follow", label = "跟随全局" },
  { value = "vertical", label = "强制竖排" },
  { value = "horizontal", label = "强制横排" },
]

[[items]]
key = "input.email.enabled"
group = "input"
section = "网址/邮箱输入"
opens_dialog = "email"
type = "toggle"
label = "邮箱输入模式"
hint = "打了字之后按 @ 即进入，候选给出常用后缀拼成的完整邮箱。空缓冲按 @ 不触发，照常出标点"

[[items]]
key = "input.email.suffixes"
group = "input"
section = "网址/邮箱输入"
dialog_group = "email"
type = "strlist_text"
label = "邮箱后缀"
hint = "预置的后缀列表（写 @ 之后的部分，如 qq.com gmail.com），按空格分隔。表外的后缀也能直接打，用过一次就会被记住并排到前面"

[[items]]
key = "input.email.candidate_layout"
group = "input"
section = "网址/邮箱输入"
dialog_group = "email"
type = "select"
label = "邮箱候选窗布局"
hint = "邮箱输入期间候选窗的排列方向；退出后自动恢复。跟随全局 = 用外观页的候选布局设置"
width = 210
enabled_when = "input.email.enabled == true"
options = [
  { value = "follow", label = "跟随全局" },
  { value = "vertical", label = "强制竖排" },
  { value = "horizontal", label = "强制横排" },
]

# ── Unicode 输入 ──
# 与网址输入同属「前缀夺取式」模式（core 侧 docs/design/prefix-hijack-modes.md），
# 故三项的形态与上面那组刻意一致——同类东西在设置页里长得一样，用户少学一次。
[[items]]
key = "input.unicode.enabled"
group = "input"
section = "Unicode 输入"
opens_dialog = "unicode"
type = "toggle"
label = "Unicode 输入模式"
hint = "打出 u+ 再接十六进制码点即可出该字符（u+4e00 → 一），空格或回车上屏"

[[items]]
key = "input.unicode.prefixes"
group = "input"
section = "Unicode 输入"
dialog_group = "unicode"
type = "strlist_text"
label = "触发前缀"
hint = "识别为码点输入的前缀（如 u+ U+），按空格分隔。区分大小写；不要填单个字母，那会占掉该字母开头的所有编码"

# 与网址那项不同，**这一项不隐藏**：码点输入会实实在在出一条候选，布局设置有可观察的效果。
[[items]]
key = "input.unicode.candidate_layout"
group = "input"
section = "Unicode 输入"
dialog_group = "unicode"
type = "select"
label = "候选窗布局"
hint = "Unicode 输入期间候选窗的排列方向；退出后自动恢复。跟随全局 = 用外观页的候选布局设置"
width = 210
enabled_when = "input.unicode.enabled == true"
options = [
  { value = "follow", label = "跟随全局" },
  { value = "vertical", label = "强制竖排" },
  { value = "horizontal", label = "强制横排" },
]

# ── 联想 ──
# 上屏之后按刚上屏的内容再给一批候选。core 侧设计见 WindInput/docs/design/association.md。
# 注：四个「来源开关」(history/bigram/prefix/punct) 不在此暴露，理由见 capabilities.rs 的
#     UNCOVERED_BY_DESIGN ⑱。
# 注：本段对应 core 的 [input.association]，那是**桌面基线**；移动端取值在 core 的
#     [mobile.association] 里，本程序只在桌面端运行故不涉及（已登记 ⑳）。
[[items]]
key = "input.association.kind"
group = "input"
section = "联想输入"
opens_dialog = "assoc"
type = "select"
label = "联想类型"
hint = "从词库里找以刚上屏内容开头的更长的词：输入「中」提示「中国」「中间」，选中只补出多出来的部分"
width = 210
# ⚠️ **不列 smart（智能联想）**：它设计上有四个来源，已实现的只有词库前缀与标点，而标点
#    在桌面默认关 ⇒ 桌面上选 smart 拿到的与 word 完全相同。摆一个和隔壁没区别的选项，
#    用户只会反复试。等 history/bigram 落地、两档真正分开了再放出来。
#    core 侧值域仍有 smart（移动端出厂就是它），手改 config.toml 照样能启用；
#    已配 smart 的用户打开设置页会看到「smart（当前配置）」——select_index_for 的兜底，
#    不会在「打开设置页、点一次保存」之间被静默换成 word。
options = [{ value = "off", label = "关闭" }, { value = "word", label = "词语联想" }]

[[items]]
key = "input.association.mode"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "select"
label = "连续联想"
hint = "持续联想 = 选中联想词后拿它当新的上文接着给（「中」→「中国」→ 以「中国」开头的词）；一次性 = 只出一次，任何非选词动作即退出"
width = 210
enabled_when = "input.association.kind != off"
options = [
  { value = "one_shot", label = "一次性" },
  { value = "continuous", label = "持续联想" },
]

[[items]]
key = "input.association.max_count"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "number"
label = "候选条数上限"
hint = "联想候选最多显示几条"
min = 1
max = 20
enabled_when = "input.association.kind != off"

[[items]]
key = "input.association.space_commits"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "toggle"
label = "空格上屏联想候选"
hint = "空格上屏当前高亮的联想词，多数输入法如此。关掉则空格照常出空格，联想窗同时收起"
enabled_when = "input.association.kind != off"

[[items]]
key = "input.association.select_keys_commit"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "toggle"
label = "二三候选键选联想"
hint = "开启（默认）时 ; ' 等二三候选键照常选第 2、3 条联想词。关掉则联想窗出来后按这些键不选联想：联想窗收起，该键照常输入（如出分号；若它另是快捷输入等模式的引导键，则照常进该模式）"
enabled_when = "input.association.kind != off"

# 回车与退格的默认值**相反**（回车透传、退格吃键）：回车的透传是把正事办了，退格的透传
# 是删掉刚上屏的字、不可逆。core 侧理由见 AssociationConfig 两个字段的文档。
[[items]]
key = "input.association.enter_cancels_only"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "toggle"
label = "回车仅取消联想"
hint = "开启后回车只收起联想窗，要再按一次才换行或发送。关闭（默认）则收窗的同时回车照常生效"
enabled_when = "input.association.kind != off"

[[items]]
key = "input.association.backspace_cancels_only"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "toggle"
label = "退格仅取消联想"
hint = "开启（默认）后退格只收起联想窗，要再按一次才删字。关闭则收窗的同时直接删掉前一个字"
enabled_when = "input.association.kind != off"

[[items]]
key = "input.association.hide_after_ms"
group = "input"
section = "联想输入"
dialog_group = "assoc"
type = "number"
label = "自动隐藏"
hint = "联想窗显示多久后自动收起。0 = 不自动隐藏；联想候选几乎一直挂着，久留会挡住正文"
min = 0
max = 60000
step = 500
unit = "毫秒"
enabled_when = "input.association.kind != off"

# 注：input.association.hint（编码栏标识）不在此暴露，见 capabilities.rs 的
#     UNCOVERED_BY_DESIGN ㉑。

# ── 词频 ──
# key 前缀是 schema.* 而落在「输入」页：它是**三个引擎都照办的同一条规则**（core 的
# [schema.frequency] 段），不属于任何单个引擎的方案配置，放进码表/拼音/英文任一段
# 都是在说一件不成立的事。group 与 key 前缀本就不必一致（schema.mix_modes#members
# 同样在 input 页）。
[[items]]
key = "schema.frequency.exclude_blocks"
group = "input"
section = "词频"
type = "dialog_button_open_pairs"
label = "不参与词频的字符"
hint = "这些字符选中后不记录、也不受已有记录影响。emoji 多是一次性点缀，让它参与调频会把常用字挤下去"
options = [
  { value = "emoji", label = "emoji", hint = "表情、旗帜与各类图形符号（😀 ⚽ ✅ ⌚ 🇨🇳）" },
  { value = "符号", label = "符号", hint = "标点、数学、箭头、图形、带圈数字、全角形式（— ∞ → ① ￥ ⿰）" },
  { value = "其它", label = "其它", hint = "新版 Unicode 新增的、本程序还不认识的区块" },
]

# ═══════════════════════════ 按键 ═══════════════════════════
# 注：键位字符串理想用「热键合成器」对话框编辑；此处先以 string 暴露，便于查看/直填。
# ── 中英文切换 ──
[[items]]
key = "keys.toggle_mode_keys"
group = "keys"
section = "中英文切换"
type = "checkbox_group"
label = "切换按键"
hint = "勾选用于切换中英文的按键（可多选，按下任意一个即切换）。Caps Lock 仅 Windows 支持：短按切换，按住半秒以上松开才开关大写锁定。想用 Ctrl+Space 这类组合键，到「按键 → 全局自定义按键」里把它绑成「中英文切换」"
[[items.options]]
value = "lshift"
label = "左 Shift"
[[items.options]]
value = "rshift"
label = "右 Shift"
[[items.options]]
value = "lctrl"
label = "左 Ctrl"
[[items.options]]
value = "rctrl"
label = "右 Ctrl"
[[items.options]]
value = "capslock"
label = "Caps Lock"

[[items]]
key = "keys.commit_on_switch"
group = "keys"
section = "中英文切换"
type = "toggle"
label = "切换时编码上屏"
hint = "中文切换为英文、或切换输入方案时，将已输入的编码直接上屏"

[[items]]
key = "input.punct.follow_mode"
group = "keys"
section = "中英文切换"
type = "toggle"
label = "标点随中英文切换"
hint = "切换到中文模式时自动切换中文标点"

# 不常改的四项收进「中英文切换高级设置」对话框，卡片上只留一行入口。
[[items]]
key = "input.capslock.commit_upper"
group = "keys"
section = "中英文切换"
# 不点名 Windows 专属的三项：Linux 上框里只有本项。
dialog_hint = "CapsLock 切换时大写上屏等不常改的选项"
dialog_title = "中英文切换高级设置"
type = "toggle"
label = "CapsLock 切换时编码转大写上屏"
hint = "打字时按 CapsLock，正在打的编码转成大写上屏（打 wps 得 WPS）：开大写时如此，CapsLock 设为切换按键、用它切到英文时也如此。已选定的字词不转。只管大小写，上不上屏看「切换时编码上屏」（临时英文总会上屏）"
# 不挂 enabled_when = commit_on_switch：临英缓冲不看那一项、总会上屏，本项在那里照样生效。
# macOS 前端不上报 CapsLock keyup，这一支没有触发点。
platform = "windows, linux"

[[items]]
key = "keys.ctrl_space_toggle"
group = "keys"
section = "中英文切换"
dialog_extra_for = "input.capslock.commit_upper"
type = "toggle"
label = "Ctrl+空格 切换中英文"
hint = "关闭后 Ctrl+空格 原样交给应用（如 IDEA、Android Studio 的代码提示）。在「全局自定义按键」里把 Ctrl+空格 设为「不启用」效果相同。若 Windows 也开着同名系统热键，应用仍收不到这个键，需到 系统设置 → 时间和语言 → 输入 → 高级键盘设置 → 输入语言热键 里关闭「输入法/非输入法切换」"
# GH#172。落点是 TSF DLL 的吃键判定 + 系统热键翻 compartment 后的服务端拒绝，都是 Windows 专属；
# macOS 的中英切换走系统输入源快捷键，与本项无关。
platform = "windows"

[[items]]
key = "input.capslock.cancel_on_mode_switch"
group = "keys"
section = "中英文切换"
dialog_extra_for = "input.capslock.commit_upper"
type = "toggle"
label = "切换中英文时取消大写锁定"
hint = "切换中英文模式时自动取消大写锁定状态；切换方案不受此项影响，一律取消"
# macOS 无落点：实现手段是合成一次 CapsLock 敲击（`key_inject::tap_caps_lock`），而
# 大写锁定态在 macOS 由 HID 层维护，CGEvent 合成的 CapsLock 改不动它（要走
# IOHIDSetModifierLockState 那条完全不同的路）。补 VK→CGKeyCode 映射也没用。
platform = "windows"

[[items]]
key = "input.capslock.mode_after_cancel"
group = "keys"
section = "中英文切换"
dialog_extra_for = "input.capslock.commit_upper"
type = "select"
label = "取消大写后进入"
hint = "上一项开着时，切换中英文取消了大写锁定之后落到哪个模式。「中文」是原有行为：Shift 回到中文，Ctrl+空格 按它自己的切换方向"
width = 210
enabled_when = "input.capslock.cancel_on_mode_switch == true"
# 平台门控同上一项：它没有落点，本项也就无从生效。
platform = "windows"
