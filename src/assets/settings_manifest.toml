hint = "打出词语后，在候选中追加对应的 emoji（如「开心」→ 😄）。首次开启时建立索引，稍候片刻"

# 不列 comment（只在注释区显示）：注释区目前没有上屏入口，选了等于什么都看不到。
# core 侧保留该取值，待注释上屏功能落地后加回选项即可（见 capabilities.rs 的
# NARROWED_ON_PURPOSE）。
[[items]]
key = "input.emoji.show_as"
group = "input"
section = "Emoji/OpenCC"
dialog_group = "emoji"
type = "select"
label = "显示位置"
hint = "紧随词后：插在对应词之后，其后候选的序号顺延；列表末尾：追加在常用候选之后，原有序号不变"
