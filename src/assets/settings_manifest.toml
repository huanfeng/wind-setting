group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "number"
label = "拼音最小触发长度"
hint = "编码达到此长度才开始查拼音候选（0 表示跟随方案默认值 2）"
min = 0
max = 10

[[items]]
key = "schema.mix.enable_pinyin_abbrev"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "启用拼音简拼"
hint = "拼音支持声母简拼（nh→你好）；关闭则只认全拼、候选更精简，且满码后继续输入才会顶码上屏码表词"

[[items]]
key = "schema.mix.pinyin_partial_candidates"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "显示拼音前缀匹配"
hint = "只有编码开头能读成拼音时（gedw 的 ge），显示这些读不完整的候选"

[[items]]
key = "schema.mix.pinyin_partial_candidates_overflow"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "超码长时显示拼音前缀匹配"
hint = "编码超过最大码长后同上；开着可先选前半段上屏，剩余接着打"

[[items]]
key = "schema.mix.pinyin_code_hint"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "拼音候选显示码表编码"
hint = "编码反查：用拼音打出的字词，旁边显示它的码表编码（如五笔拼音下打 nihao，「你好」旁显示 wqvb），方便记码。只管混输方案；纯拼音方案看「方案 → 拼音 → 编码提示来源」，临时拼音看「方案 → 临时拼音」"

