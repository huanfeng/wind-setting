# ── 混输行为（混输全局配置；全局唯一，无方案级 override）──
#
# ⚠️ 项序即渲染序，且 `subsection = None` **不会终止**前一个分组（对话框渲染只在
# subsection 变化且非 None 时插标题）⇒ **无 subsection 的通用项必须全部声明在下面
# 两个 subsection 之前**，否则会被静默吸附成上一个分组的成员。
# hidden 项在渲染前就被跳过、不影响游标，但仍按语义就位——将来取消 hidden 才落在对的组里。
[[items]]
key = "schema.mix.show_source_hint"
group = "schema"
section = "混输行为"
type = "toggle"
label = "显示候选来源标记"
hint = "混输模式下在候选旁显示来源标识（码表/拼音）"

[[items]]
key = "schema.mix.enable_english"
group = "schema"
section = "混输行为"
type = "toggle"
label = "启用英文候选"
hint = "混输模式下同时查询英文词库并显示英文候选"

# 英文最小触发长度：预留配置，暂不对用户开放（默认 3，即 2 字符以内不查英文）。
[[items]]
key = "schema.mix.min_english_length"
group = "schema"
section = "混输行为"
type = "number"
label = "英文最小触发长度"
hint = "编码达到此长度才开始查英文候选（0 表示跟随默认值 3，即 2 字符以内不查）"
min = 0
max = 10
hidden = true

# ── 拼音相关：拼音候选的范围有多宽 ──
# 项序即渲染序：先「从第几码开始查拼音」，再「查出来的候选放多宽」。
[[items]]
key = "schema.mix.min_pinyin_length"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "number"
label = "拼音最小触发长度"
hint = "编码达到此长度才开始查拼音候选（0 表示跟随方案默认值 2）"
min = 0
max = 10

[[items]]
key = "schema.mix.enable_pinyin_abbrev"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "启用拼音简拼"
hint = "拼音支持声母简拼（nh→你好）；关闭则只认全拼、候选更精简，且满码后继续输入才会顶码上屏码表词"

[[items]]
key = "schema.mix.pinyin_partial_candidates"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "显示拼音前缀匹配"
hint = "只有编码开头能读成拼音时（gedw 的 ge），显示这些读不完整的候选"

[[items]]
key = "schema.mix.pinyin_partial_candidates_overflow"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "超码长时显示拼音前缀匹配"
hint = "编码超过最大码长后同上；开着可先选前半段上屏，剩余接着打"

# 超码长仅查拼音（core 默认 true，主流混输行为）：隐藏，不对用户开放。
[[items]]
key = "schema.mix.pinyin_only_overflow"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "超码长时仅查拼音"
hint = "编码超过最大码长时只显示拼音候选，不再查码表"
hidden = true

# ── 上屏设置：什么情况下不自动上屏码表词 ──
[[items]]
key = "schema.mix.auto_commit_block_on_pinyin"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "toggle"
label = "有拼音候选时否决上屏"
hint = "满码自动上屏与顶码上屏前，若整串仍能查出拼音候选则不自动上屏（不看拼音是否成词）；「顶码优先」开启时无视本项。本项同时管「满码无候选清空」：开启时有拼音候选或拼音还没打完都不清空，关闭则满码无匹配即清空"

[[items]]
key = "schema.mix.block_commit_on_pinyin_word"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "toggle"
label = "整串是拼音词时否决上屏"
hint = "整串是完整拼音且拼音首选为真实词（如 wangba→网吧）时，不自动/顶码上屏五笔，留给你选拼音词；aipu→落实 等无强词的仍正常上屏"

# 拼音词强度权重阈值：预留配置，默认 0（仅结构判据：拼音首选须≥2汉字且消费整串）。
[[items]]
key = "schema.mix.pinyin_word_min_weight"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "number"
label = "拼音词强度阈值"
hint = "拼音歧义拦截的词权重下限（0 表示仅用结构判据，不设权重门槛；真机误拦时可上调收紧）"
min = 0
max = 100000000
hidden = true

[[items]]
key = "schema.mix.auto_commit_block_on_english"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "toggle"
label = "有英文候选时否决满码上屏"
hint = "满码自动上屏前若存在英文候选（含前缀）则不自动上屏；仅启用英文候选时有效"

# 顶码歧义裁决（core 默认 false，保护拼音）：隐藏，不对用户开放。
[[items]]
key = "schema.mix.top_code_override_pinyin"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "toggle"
label = "顶码优先（覆盖拼音）"
hint = "顶码上屏时优先选择码表词条而非拼音候选"
hidden = true

# ── 英文行为（英文方案的全局配置；「全局方案配置 → 英文方案配置」对话框）──
# 英文现在是可切换方案，core 侧也有了自己的 [schema.english] 段，不再共用码表那套
# ——此前英文用户改调频策略会连带改掉五笔的。
#
# 临时英文那批（大小写变形 / 符号数字 / 空格作为输入）**刻意不搬**：它们的 key 是
# input.temp_english.*，只在临英 overlay 里被读取，英文方案走主输入路径根本不经过
# 那段逻辑。搬过来会让用户以为改的是英文方案，实际改的是另一个模式。
[[items]]
key = "schema.english.frequency.enabled"
group = "schema"
section = "英文行为"
type = "toggle"
label = "启用词频调整"
hint = "按使用频率调整英文候选顺序"

[[items]]
key = "schema.english.frequency.strategy"
group = "schema"
section = "英文行为"
type = "select"
label = "调频策略"
hint = "位次渐进：每用一次前移一半，久不用回落；一次到顶 / 逐次提升：用过即排到未用过的之前"
width = 210
enabled_when = "schema.english.frequency.enabled == true"
options = [
    { value = "position", label = "位次渐进" },
    { value = "top", label = "一次到顶" },
    { value = "step", label = "逐次提升" },
]

[[items]]
key = "schema.english.frequency.promote_prefix"
group = "schema"
section = "英文行为"
type = "select"
label = "补全词参与调频"
hint = "打 hel 选中 hello 这类前缀补全的候选是否参与调频，仅「位次渐进」策略下生效"
width = 210
enabled_when = "schema.english.frequency.enabled == true && schema.english.frequency.strategy == position"
options = [
    { value = "all", label = "全部" },
    { value = "single", label = "仅单词" },
    { value = "none", label = "不参与" },
]

[[items]]
key = "schema.english.frequency.half_life"
group = "schema"
section = "英文行为"
type = "number"
label = "热度衰减半衰期"
hint = "使用记录衰减到一半所需的时间，仅「位次渐进」策略下生效。0 = 默认 72 小时"
min = 0
max = 8760
step = 12
unit = "小时"
enabled_when = "schema.english.frequency.enabled == true && schema.english.frequency.strategy == position"

[[items]]
key = "schema.english.frequency.code_scope"
group = "schema"
section = "英文行为"
type = "select"
label = "调频记账方式"
hint = "按整词：打 hel 选过 hello 后，打 he 也受益；按编码：各前缀独立学习"
width = 210
enabled_when = "schema.english.frequency.enabled == true"
options = [
    { value = "candidate", label = "按整词" },
    { value = "input", label = "按编码" },
]

[[items]]
key = "schema.english.raw_candidate"
group = "schema"
section = "英文行为"
type = "toggle"
label = "首候选为所打原文"
hint = "把输入的字母串本身放在首位，空格直接上屏它；关闭后首位是词库补全，打生词要按回车"

[[items]]
key = "schema.english.case_variants"
group = "schema"
section = "英文行为"
type = "toggle"
label = "生成大小写变形候选"
hint = "补出全小写、首字母大写、全大写三种形态。它们各占一个候选位；临时英文的同名开关另设"

[[items]]
key = "schema.english.commit_space"
group = "schema"
section = "英文行为"
type = "toggle"
label = "上屏后自动加空格"
hint = "上屏英文词后补一个空格，连续打词不必手动按；回车上屏不补"

# ═══════════════════════════ 输入 ═══════════════════════════
# ── 字符与标点 ──
[[items]]
key = "input.filter_mode"
group = "input"
section = "字符与标点"
type = "select"
label = "候选检索范围"
hint = "过滤候选词中的生僻字；「智能」档可在扩展设置里配置临时放宽"
opens_dialog = "scope_relax"
options = [
  { value = "smart", label = "智能" },
  { value = "general", label = "常用字" },
  { value = "gb18030", label = "全部字符" },
]

[[items]]
key = "input.scope_relax.page_end_key"
group = "input"
section = "字符与标点"
type = "toggle"
label = "翻到底临时放宽范围"
hint = "候选翻到最后一页后再按一次向后翻页键，本次输入临时显示全部字符，上屏后自动恢复；用于打出被同码常用字挡住的生僻字。仅「智能」档生效"
enabled_when = "input.filter_mode == smart"
dialog_group = "scope_relax"

[[items]]
key = "input.scope_relax.prefix"
group = "input"
section = "字符与标点"
