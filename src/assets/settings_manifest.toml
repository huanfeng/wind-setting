# ── 上屏设置：什么情况下不自动上屏码表词 ──
[[items]]
key = "schema.mix.auto_commit_block_on_pinyin"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "toggle"
label = "有拼音候选时否决上屏"
hint = "满码自动上屏与顶码上屏前，若整串仍能查出拼音候选则不自动上屏（不看拼音是否成词）；「顶码优先」开启时无视本项。本项同时管「满码无候选清空」：开启时有拼音候选或拼音还没打完都不清空，关闭则满码无匹配即清空"

[[items]]
key = "schema.mix.block_commit_on_pinyin_word"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
type = "toggle"
label = "整串是拼音词时否决上屏"
hint = "整串是完整拼音且拼音首选为真实词（如 wangba→网吧）时，不自动/顶码上屏五笔，保留拼音词供选择；aipu→落实 等无强词的仍正常上屏"

# 拼音词强度权重阈值：预留配置，默认 0（仅结构判据：拼音首选须≥2汉字且消费整串）。
[[items]]
key = "schema.mix.pinyin_word_min_weight"
group = "schema"
section = "混输行为"
subsection = "上屏设置"
