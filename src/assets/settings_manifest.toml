group = "input"
section = "联想"
type = "toggle"
label = "退格仅取消联想"
hint = "开启（默认）后退格只收起联想窗，要再按一次才删字。关闭则收窗的同时直接删掉前一个字"
enabled_when = "input.association.kind != off"

[[items]]
key = "input.association.hide_after_ms"
group = "input"
section = "联想"
type = "number"
label = "自动隐藏"
hint = "联想窗显示多久后自动收起。0 = 不自动隐藏；联想候选几乎一直挂着，久留会挡住正文"
