#
# ⚠️ 项序即渲染序，且 `subsection = None` **不会终止**前一个分组（对话框渲染只在
# subsection 变化且非 None 时插标题）⇒ **无 subsection 的通用项必须全部声明在下面
# 两个 subsection 之前**，否则会被静默吸附成上一个分组的成员。
# hidden 项在渲染前就被跳过、不影响游标，但仍按语义就位——将来取消 hidden 才落在对的组里。
