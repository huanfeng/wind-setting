section = "Emoji/OpenCC"
dialog_group = "emoji"
type = "select"
label = "适用范围"
hint = "仅完整词：只为完整匹配的词追加；全部候选：补全与部分匹配的候选也追加"
enabled_when = "input.emoji.enabled == true"
options = [
  { value = "exact", label = "仅完整词" },
  { value = "all", label = "全部候选" },
  { value = "off", label = "不追加" },
]

[[items]]
key = "input.emoji.max_hosts"
group = "input"
section = "Emoji/OpenCC"
dialog_group = "emoji"
type = "number"
label = "追加范围"
hint = "只为列表前 N 个候选追加 emoji。1 = 仅首选"
min = 0
max = 20
enabled_when = "input.emoji.enabled == true"

[[items]]
key = "input.emoji.max_per_word"
group = "input"
section = "Emoji/OpenCC"
dialog_group = "emoji"
type = "number"
label = "每词上限"
hint = "一个词最多追加的 emoji 个数"
min = 1
max = 10
enabled_when = "input.emoji.enabled == true"

[[items]]
key = "input.emoji.min_word_chars"
group = "input"
section = "Emoji/OpenCC"
dialog_group = "emoji"
type = "number"
label = "最少字数"
hint = "候选少于此字数时不追加。默认 2，即不为单字追加"
min = 1
max = 8
enabled_when = "input.emoji.enabled == true"

[[items]]
key = "input.emoji.categories"
group = "input"
section = "Emoji/OpenCC"
dialog_group = "emoji"
type = "toggle"
label = "启用分类词"
hint = "「动物」「水果」等分类词会带出整组 emoji，数量受每词上限约束"
enabled_when = "input.emoji.enabled == true"

# 附加模块（core 的 EMOJI_MODULES + 用户放进用户目录 emoji\ 的 OpenCC 表）：条数不定，走对话框，
# 整张 input.emoji.modules 表读写。
[[items]]
key = "input.emoji.modules"
group = "input"
section = "Emoji/OpenCC"
type = "dialog_button_emoji_modules"
indent = false
label = "附加模块"
hint = "按模块加挂 emoji 与符号表（偏旁、希腊字母、单位等）；也可在用户目录 emoji\\ 下放 OpenCC 格式的 .txt 自行扩充"
enabled_when = "input.emoji.enabled == true"

# ── 网址/邮箱输入 ──
# 两个模式合成一个分区：它们共用同一个补全候选源（core 的 mode_completion.rs），
# 开关、触发条件、候选行为逐条对位，用户学一次即可。历史与后缀的「查看/清空」入口
# 都在词库页（那里有现成的列表 + 逐条删 + 清空确认），本分区的 hint 里指路过去。
[[items]]
key = "input.url.enabled"
group = "input"
section = "网址/邮箱输入"
opens_dialog = "url"
type = "toggle"
label = "网址输入模式"
hint = "打出完整前缀（如 http、www.）即进入网址输入模式，可自由输入网址，空格或回车上屏"

[[items]]
key = "input.url.prefixes"
group = "input"
section = "网址/邮箱输入"
dialog_group = "url"
type = "strlist_text"
label = "触发前缀"
hint = "识别为网址的前缀（如 www. http https ftp.），按空格分隔"

[[items]]
key = "input.url.history_enabled"
group = "input"
section = "网址/邮箱输入"
dialog_group = "url"
type = "toggle"
label = "记住输入过的网址"
hint = "把上屏过的网址记下来，下次打前几个字符即可补全。记录可在「词库 → 网址历史」查看和清空"
enabled_when = "input.url.enabled == true"

[[items]]
key = "input.url.history_max"
group = "input"
section = "网址/邮箱输入"
dialog_group = "url"
type = "number"
label = "历史条数上限"
hint = "超出后按「用得少、用得旧」自动清理。0 = 不限"
min = 0
max = 10000
step = 50
unit = "条"
enabled_when = "input.url.enabled == true && input.url.history_enabled == true"

# 网址模式开始产出候选（历史补全）后，这一项才有可观察的效果，故此前的 hidden 已删。
