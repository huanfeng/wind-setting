# 统一声明式设置清单（native 内置真相源；core 已退役 manifest.toml）。
# 字段：key(点路径,对应 Config)/group/section/type/label/hint/options/options_source/min/max/step/unit/width/enabled_when/gate_key/global
#   width：select 下拉像素宽；options_source：动态选项来源（themes/fonts/codetableSchemas/pinyinSchemas）
# indent：false = 依赖同卡其它项时不缩进（缺省缩进）。
# 注：默认值不在此声明，统一取自 core capability 快照（capabilities.snapshot.json）。
#
# 【对照来源】参考项目 WindInput/wind_setting（web 配置页）的页面/分区/字段组织与文案；
#   key 必须与本项目 core 的真实配置点路径逐字一致（见 capabilities.snapshot.json）。
# 【分组】group → 页面主体；section → 页内子卡片。
#   前端按 (group, section) 聚合：同 section 的项渲染为一张卡片，section 首次出现序为卡片序，
#   卡片内项序即 items 出现序——故同 section 的项务必相邻声明，且按「基础/开关在前、细节在后」排列。
# 【布局对照表】docs/redesign/settings-layout-correspondence.md
# 【方案页引擎设置】分两级：①全局级（本文件 schema 组「上屏行为/候选行为」，常用通用设置，快捷配置）；
#   ②per-schema 级（方案设置弹窗，后续实现）。
# 【动态可选值】select 项可用 options_source（codetableSchemas/pinyinSchemas/fonts/themes）声明选项来源。


# ── 分组（→ 页面主体）──
[[groups]]
key = "schema"
label = "方案"
order = 1

[[groups]]
key = "input"
label = "输入"
order = 2

[[groups]]
key = "keys"
label = "按键"
order = 3

[[groups]]
key = "ui"
label = "外观"
order = 4

[[groups]]
key = "general"
label = "常规"
order = 5

[[groups]]
key = "advanced"
label = "高级"
order = 6

# ═══════════════════════════ 方案 ═══════════════════════════
# ── 主方案设置 ──
[[items]]
key = "schema.primary_codetable"
group = "schema"
section = "主方案设置"
type = "select"
options_source = "codetableSchemas"               # 选项运行时来自 schema.list（码表类）
label = "主码表方案"
hint = "主力码表方案 id（如 wubi86）；拼音方案的反查/编码提示基于此方案的码表"

[[items]]
key = "schema.primary_pinyin"
group = "schema"
section = "主方案设置"
type = "select"
options_source = "pinyinSchemas"                                # 选项运行时来自 schema.list（拼音类）
label = "主拼音方案"
hint = "临时拼音、快捷输入使用的拼音方案（可选双拼）；留空 = 全拼。混输方案的拼音由方案自身配置决定，不受此项影响"

# ── 上屏行为（码表全局基线；方案可经 schema_overrides 覆盖）──
[[items]]
key = "schema.codetable.auto_commit_at_full"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "全码唯一自动上屏"
hint = "唯一精确且无更长后继时直接上屏"

# 档位而不是数字步进器：核心里 `0` 的意思是「等于该方案的全码长」，这层语义在一个写着
# 0 的数字框里读不出来。下拉能把它写成字，顺带挡住比方案全码长还大的取值——编码永远
# 够不着门槛，等于把自动上屏整个关掉，而界面上看不出异样。
[[items]]
key = "schema.codetable.auto_commit_min_len"
group = "schema"
section = "上屏行为"
type = "number_select"
label = "自动上屏最短码长"
hint = "打够这个码长，唯一候选就自动上屏；「满码」= 跟随方案自己的全码长"
width = 160
options = [
  { value = "0", label = "满码（跟随方案）" },
  { value = "1", label = "1 码" },
  { value = "2", label = "2 码" },
  { value = "3", label = "3 码" },
  { value = "4", label = "4 码" },
  { value = "5", label = "5 码" },
]
enabled_when = "schema.codetable.auto_commit_at_full == true"

[[items]]
key = "schema.codetable.clear_on_empty_max"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "满码空码清空"
hint = "编码达到最大码长且无候选时自动清空缓冲"

[[items]]
key = "schema.codetable.top_code_commit"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "顶码上屏"
hint = "编码超过最大码长时自动顶字上屏首选"

[[items]]
key = "schema.codetable.punct_commit"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "标点顶码上屏"
hint = "输入标点时自动上屏首选"

[[items]]
key = "schema.codetable.show_code_hint"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "显示编码提示"
hint = "候选旁显示对应编码"

[[items]]
key = "schema.codetable.single_code_input"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "精确匹配模式"
hint = "仅显示精确匹配的候选，不显示前缀匹配"

[[items]]
key = "schema.codetable.single_code_complete"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "精确匹配空码补全"
hint = "精确匹配模式下无候选时，自动从更长编码中取首个候选"
enabled_when = "schema.codetable.single_code_input == true"

[[items]]
key = "schema.codetable.z_key_repeat"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "z 键重复输入"
hint = "输入z时首选为上一次上屏的内容，快速重复输入"

# z 的两个身份共用一个键，由 core 在运行时裁决：z_key_repeat 开且有上屏历史、
# 或 z 是本方案的活码前缀时，本项让位（见 core handle_lifecycle.rs 的三重身份裁决）。
# 融合/特殊模式的实例 id 随已安装方案增删，清单只列内置的 quick_mix；配了其他实例的
# 用户，其取值由下拉的「保留当前配置」项兜住，不会在保存时被抹掉。
# `rare_char` 必须列出：输入页「生僻字触发键」的提示语把字母键指路到这里（GH#146）。
# 出厂 `zz*` 短语让首键 z 恒让位，进模式靠 core 的 z 夺取回路（`try_z_fallback`），
# 生僻字那一臂与本项同批补上，input_flow 的 test_z_key_action_enters_rare_char 钉住。
# `reverse` 同 `rare_char`：出厂 `zz*` 短语下靠 core 的 z 夺取进入。
[[items]]
key = "schema.codetable.z_key_action"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "select"
label = "z 键引导功能"
hint = "z 在本方案是死码时（如五笔 86）可借作引导键，空码状态下按 z 进入所选模式；与「z 键重复输入」冲突时后者优先"
options = [
  { value = "", label = "不启用（作编码字母）" },
  { value = "temp_pinyin", label = "临时拼音" },
  { value = "temp_english", label = "临时英文" },
  { value = "mix:quick_mix", label = "快捷输入" },
  { value = "rare_char", label = "生僻字" },
  { value = "reverse", label = "反查模式" },
]

# 通配输入（万能键）。首位 / 非首位的让位规则由 core 裁决（wind-coordinator/src/wildcard.rs），
# 键的合法性（单个字母或 ASCII 符号，数字与空格不可用）也由 core 校验，非法值告警并视为关闭。
[[items]]
key = "schema.codetable.wildcard"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "通配输入"
hint = "组码时按通配键代替一个拿不准的码元，候选旁显示完整编码；通配结果不自动上屏、不顶字。符号通配键在首键也作通配（临时拼音等全局引导键让位，方案按键绑定仍优先）；字母通配键首键已有功能（z 键引导、z 键重复、活码）时让位；组码中若是选词、翻页、分隔键也让位，满码后照常顶字。五笔拼音混输方案下，首键和超出五笔码长的串按拼音处理，码长内通配结果与拼音候选一起列出"

# 下拉只列三个常用选项，与出厂键位的关系各不相同：
#   z      —— 出厂 z 键无绑定，但 z 键重复 / z 键引导开启时首位让位给它们（五笔类以外的方案 z 常是真实码元）；
#   `      —— 符号键：首位也作通配，出厂临拼的反引号引导随之让位（0.126 起，论坛 t302）；
#   ?      —— 符号键：首位也作通配；组码中途会先于「标点顶屏」被当通配——要打它本身须另想办法。
# 符号键首位作通配、全局引导键让位、方案级 [key_actions] 显式绑定仍优先，都是 core 的裁决。
# 配了其它字符的用户由下拉的「保留当前配置」项兜住。
[[items]]
key = "schema.codetable.wildcard_key"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "select"
label = "通配键"
hint = "26 码元的方案请选符号键；符号键在首键与组码中都作通配（满码后照常顶字），该符号本身请用快捷输入或短语打出。选了本方案真实用到的码元，该码元会被通配吞掉"
enabled_when = "schema.codetable.wildcard == true"
options = [
  { value = "z", label = "z" },
  { value = "`", label = "` 反引号" },
  { value = "?", label = "? 问号" },
]

# 通配仅单字：行内通配与反查模式都受它管，故不挂 enabled_when（反查模式不看通配主开关）。
# 单字判据是字素簇（core 的 wind_candidate::single_markable_char）。
[[items]]
key = "schema.codetable.wildcard_single_only"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "通配仅出单字"
hint = "通配与反查模式的结果只列单字，词组不出。不影响正常打字"

# 档位取「对哪几级简码生效」，故 core 侧判据是「当前码长 > 档位」而非「等于全码长」——
# 非五笔方案的全码长未必是 4，用码长比较才不必知道方案的最大码长。
# core 支持 1（仅一简），下拉不列：一简位的字本就只有 25 个，单独成档没有实际用途。
[[items]]
key = "schema.codetable.short_code_yield_level"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "number_select"
label = "出简让全"
hint = "有简码的字在更长编码上把首选让给词组，自己排到候选末尾"
width = 160
options = [
  { value = "0", label = "关闭" },
  { value = "2", label = "一、二级简码" },
  { value = "3", label = "全部简码" },
]

# 与上面的「出简让全」同属码表专属、同一 subsection：两者都在回答「这个码位该出什么」。
# 拼音另有一份（schema.pinyin.single_char），刻意不共享取值——码表开它是为了定长盲打，
# 拼音没有定长、开了只是不出词。
[[items]]
key = "schema.codetable.single_char"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "单字输入"
hint = "只出单字。同码没有词来争首选，满码唯一即可直接上屏，不必看候选窗"

# 词频调整
[[items]]
key = "schema.codetable.frequency.enabled"
group = "schema"
section = "上屏行为"
subsection = "学习与扩展"
opens_dialog = "ct_freq"
type = "toggle"
label = "词频调整"
hint = "根据使用频次动态调整候选排序"

[[items]]
key = "schema.codetable.frequency.record_always"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "toggle"
label = "仅记录次数"
hint = "不调整候选顺序，只记录每个字词的上屏次数，可在词库管理的「词频」中查看和导出。之后若开启词频调整，已记录的次数会立刻参与排序"
enabled_when = "schema.codetable.frequency.enabled == false"

[[items]]
key = "schema.codetable.frequency.strategy"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "select"
label = "调频策略"
hint = "置顶：用过一次即到首位；步进：按累计次数上升；位次渐进：每次前移一半位次，逐步靠前"
enabled_when = "schema.codetable.frequency.enabled == true"
options = [
  { value = "top", label = "置顶" },
  { value = "step", label = "步进" },
  { value = "position", label = "位次渐进" },
]

[[items]]
key = "schema.codetable.frequency.promote_prefix"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "select"
label = "补全词参与调频"
hint = "仅「位次渐进」策略下生效。英文等以前缀匹配为主的方案建议选「全部」"
enabled_when = "schema.codetable.frequency.enabled == true && schema.codetable.frequency.strategy == position"
options = [
  { value = "none", label = "不参与" },
  { value = "single", label = "仅单字/单词" },
  { value = "all", label = "全部" },
]

[[items]]
key = "schema.codetable.frequency.half_life"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "number"
label = "热度衰减半衰期"
hint = "使用记录衰减到一半所需的时间，仅「位次渐进」策略下生效。0 = 默认 72 小时"
min = 0
max = 8760
step = 12
unit = "小时"
enabled_when = "schema.codetable.frequency.enabled == true && schema.codetable.frequency.strategy == position"

[[items]]
key = "schema.codetable.frequency.protect_top_n_len1"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "number"
label = "一简位保护前 N 项"
hint = "只输入 1 个编码时（如五笔一简），词典前 N 项不参与调频。一简每个编码通常只有两个字，误选一次就会永久换掉首选，故默认保护"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

[[items]]
key = "schema.codetable.frequency.protect_top_n_len2"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "number"
label = "二简位保护前 N 项"
hint = "输入 2 个编码时，词典前 N 项不参与调频（0 = 不保护）"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

[[items]]
key = "schema.codetable.frequency.protect_top_n_len3"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "number"
label = "三简位保护前 N 项"
hint = "输入 3 个编码时，词典前 N 项不参与调频。默认不保护——三简的固定程度弱于一二简"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

[[items]]
key = "schema.codetable.frequency.protect_top_n"
group = "schema"
section = "上屏行为"
dialog_group = "ct_freq"
type = "number"
label = "全码位保护前 N 项"
hint = "输入 4 个及以上编码时，词典前 N 项不参与调频。默认 0 = 不保护，让调频在全码位正常起作用"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

# 自动造词
[[items]]
key = "schema.codetable.auto_phrase.enabled"
group = "schema"
section = "上屏行为"
subsection = "学习与扩展"
opens_dialog = "ct_auto_phrase"
type = "toggle"
label = "自动造词"
hint = "打字时自动记下可能的词组，用过一次即存入临时词库"

[[items]]
key = "schema.codetable.auto_phrase.promote_count"
group = "schema"
section = "上屏行为"
dialog_group = "ct_auto_phrase"
type = "number"
label = "转入用户词库次数"
hint = "用满几次后永久收录进用户词库；0 = 不收录，一直留在临时词库"
min = 0
max = 20
enabled_when = "schema.codetable.auto_phrase.enabled == true"

# 造词字数上下限（core 有默认 2/10）：隐藏，不对用户开放。
[[items]]
key = "schema.codetable.auto_phrase.min_phrase_len"
group = "schema"
section = "上屏行为"
dialog_group = "ct_auto_phrase"
type = "number"
label = "最短造词长度"
hint = "至少连续选几个字才记为词组"
min = 2
max = 10
hidden = true
enabled_when = "schema.codetable.auto_phrase.enabled == true"

[[items]]
key = "schema.codetable.auto_phrase.max_phrase_len"
group = "schema"
section = "上屏行为"
dialog_group = "ct_auto_phrase"
type = "number"
label = "最长造词长度"
hint = "最多记录几个字的词组"
min = 2
max = 20
hidden = true
enabled_when = "schema.codetable.auto_phrase.enabled == true"

# ── 英文候选：与混输那三项（schema.mix.*）同名同义，只是作用于码表方案 ──
# 与拼音那份（schema.pinyin.english_merge）取值独立：码表用户常打命令行、变量名，
# 拼音用户的英文词与拼音串大面积重叠，是否要开是两个判断。
[[items]]
key = "schema.codetable.english_merge.enable"
group = "schema"
section = "上屏行为"
subsection = "学习与扩展"
opens_dialog = "ct_english"
type = "toggle"
label = "英文候选"
hint = "同时查询英文词库并显示英文候选；整串恰好是一个英文词时给它（打 hello 出 hello），无中文候选时按前缀补全"

# 最小触发长度：只约束「中文侧有候选」那一路，见 hint。
[[items]]
key = "schema.codetable.english_merge.min_length"
group = "schema"
section = "上屏行为"
dialog_group = "ct_english"
type = "number"
label = "英文最小触发长度"
hint = "有中文候选时，编码达到此长度才查英文（0 = 默认 3）；中文候选为空时不受本项约束，2 码起就给英文补全"
min = 0
max = 10
enabled_when = "schema.codetable.english_merge.enable == true"

[[items]]
key = "schema.codetable.english_merge.block_commit"
group = "schema"
section = "上屏行为"
dialog_group = "ct_english"
type = "toggle"
label = "有英文候选时否决满码上屏"
hint = "满码自动上屏前若存在英文候选（含前缀）则不自动上屏；定长码表建议开着，关掉的话打 github 到第 4 键就被顶出中文"
enabled_when = "schema.codetable.english_merge.enable == true"

# ── 候选行为（拼音全局基线；方案可经 schema_overrides 覆盖）──
[[items]]
key = "schema.pinyin.code_hint_source"
group = "schema"
section = "候选行为"
type = "select"
label = "编码提示来源"
hint = "拼音方案（含双拼）下，候选旁显示哪种编码。双拼编码需装有双拼方案（全拼方案下也能显示，用于对照学习）；显示位置与格式由「外观 → 候选注释」的模板决定。临时拼音与快捷输入另设，见「方案 → 临时拼音」；混输方案另设，见「方案 → 混输 → 拼音候选显示码表编码」"
options = [
  { value = "auto", label = "自动" },
  { value = "codetable", label = "码表反查" },
  { value = "shuangpin", label = "双拼编码" },
