[[items]]
key = "schema.mix.enable_english"
group = "schema"
section = "混输行为"
type = "toggle"
label = "启用英文候选"
hint = "混输模式下同时查询英文词库并显示英文候选"

# 英文最小触发长度：预留配置，暂不对用户开放（默认 3，即 2 字符以内不查英文）。
