# ── 自定义按键：两张表的完整逐键编辑入口 ──
#
# 与上面「候选操作」那四项勾选框的关系：那四项是**常用形态**（按组勾选），本节是**完整
# 形态**（逐键指定）。两者在 core 侧合流——四项会被折算进 session_actions 同一张表，本表
# 里显式配的键优先。故放在勾选项之后：先给常用的，再给需要时才展开的。
#
# ⚠️ 两项的分野**不是**「空闲时 vs 输入中」。`key_actions` 的三条通路（组合键热键、
# 修饰键 keyup、单字符引导键）在输入中同样触发——「按 Shift 切中英文」走的正是第二条。
# 真正的差别是：前者给键指定一个功能（进模式 / 切方案 / 切状态），后者**只**在有会话时
# 生效、管的是对当前这段输入与候选的操作（翻页 / 选词 / 放弃）。同一个键在两张表里可以
# 是两个动作（Tab 输入中翻页、没在输入时仍是宿主的制表符），所以是两张表。
[[items]]
key = "keys.key_actions"
group = "keys"
section = "自定义按键"
type = "dialog_button"
label = "全局自定义按键"
hint = "为按键指定功能，如临时拼音、切换方案"

[[items]]
key = "keys.session_actions"
group = "keys"
section = "自定义按键"
type = "dialog_button"
label = "全局自定义输入中按键"
hint = "指定按键在输入中的功能，如翻页、选择候选"

