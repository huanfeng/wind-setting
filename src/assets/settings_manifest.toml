# ── 混输行为（混输全局配置；全局唯一，无方案级 override）──
[[items]]
key = "schema.mix.show_source_hint"
group = "schema"
section = "混输行为"
type = "toggle"
label = "显示候选来源标记"
hint = "混输模式下在候选旁显示来源标识（码表/拼音）"

[[items]]
key = "schema.mix.enable_english"
group = "schema"
section = "混输行为"
type = "toggle"
label = "启用英文候选"
hint = "混输模式下同时查询英文词库并显示英文候选"

# 超码长仅查拼音（core 默认 true，主流混输行为）：隐藏，不对用户开放。
[[items]]
key = "schema.mix.pinyin_only_overflow"
group = "schema"
section = "混输行为"
type = "toggle"
label = "超码长时仅查拼音"
hint = "编码超过最大码长时只显示拼音候选，不再查码表"
hidden = true

# 顶码歧义裁决（core 默认 false，保护拼音）：隐藏，不对用户开放。
[[items]]
key = "schema.mix.top_code_override_pinyin"
group = "schema"
section = "混输行为"
type = "toggle"
label = "顶码优先（覆盖拼音）"
hint = "顶码上屏时优先选择码表词条而非拼音候选"
hidden = true

[[items]]
key = "schema.mix.auto_commit_block_on_pinyin"
group = "schema"
section = "混输行为"
type = "toggle"
label = "有拼音候选时否决满码上屏"
hint = "满码自动上屏前若仍有拼音候选则不自动上屏"

[[items]]
key = "schema.mix.block_commit_on_pinyin_word"
group = "schema"
section = "混输行为"
type = "toggle"
label = "整串是拼音词时否决上屏"
hint = "整串是完整拼音且拼音首选为真实词（如 wangba→网吧）时，不自动/顶码上屏五笔，留给你选拼音词；aipu→落实 等无强词的仍正常上屏"

# 拼音词强度权重阈值：预留配置，默认 0（仅结构判据：拼音首选须≥2汉字且消费整串）。
[[items]]
key = "schema.mix.pinyin_word_min_weight"
group = "schema"
section = "混输行为"
type = "number"
label = "拼音词强度阈值"
hint = "拼音歧义拦截的词权重下限（0 表示仅用结构判据，不设权重门槛；真机误拦时可上调收紧）"
min = 0
max = 100000000
hidden = true

[[items]]
key = "schema.mix.auto_commit_block_on_english"
group = "schema"
section = "混输行为"
type = "toggle"
label = "有英文候选时否决满码上屏"
hint = "满码自动上屏前若存在英文候选（含前缀）则不自动上屏；仅启用英文候选时有效"

[[items]]
key = "schema.mix.min_pinyin_length"
group = "schema"
section = "混输行为"
type = "number"
label = "拼音最小触发长度"
hint = "编码达到此长度才开始查拼音候选（0 表示跟随方案默认值 2）"
min = 0
max = 10

# 英文最小触发长度：预留配置，暂不对用户开放（默认 3，即 2 字符以内不查英文）。
[[items]]
key = "schema.mix.min_english_length"
group = "schema"
section = "混输行为"
type = "number"
label = "英文最小触发长度"
hint = "编码达到此长度才开始查英文候选（0 表示跟随默认值 3，即 2 字符以内不查）"
min = 0
max = 10
hidden = true

# ═══════════════════════════ 输入 ═══════════════════════════
# ── 字符与标点 ──
[[items]]
key = "input.filter_mode"
group = "input"
section = "字符与标点"
type = "select"
label = "候选检索范围"
hint = "过滤候选词中的生僻字"
options = [
  { value = "smart", label = "智能" },
  { value = "general", label = "常用字" },
  { value = "gb18030", label = "全部字符" },
]

[[items]]
key = "input.punct.follow_mode"
group = "input"
section = "字符与标点"
type = "toggle"
label = "标点随中英文切换"
hint = "切换到中文模式时自动切换中文标点"

[[items]]
key = "input.punct.smart_after_digit"
group = "input"
section = "字符与标点"
type = "toggle"
label = "数字后智能标点"
hint = "数字后句号输出点号、逗号输出英文逗号，可配置参与的标点"

[[items]]
key = "input.punct.smart_list"
group = "input"
section = "字符与标点"
type = "dialog_button"
label = "数字后保持英文的标点"
hint = "数字后保持英文形态的标点集合，默认 .,:"
gate_key = "input.punct.smart_after_digit"

[[items]]
key = "input.symbol.smart_mode"
group = "input"
section = "字符与标点"
type = "toggle"
label = "智能符号模式"
hint = "连按两次同一中文标点自动转英文，可配置参与的符号集合"

[[items]]
key = "input.symbol.smart_method"
group = "input"
section = "字符与标点"
type = "select"
label = "智能符号上屏方案"
hint = "组合态预览：第一次按键先以预览态显示中文符号，超时或再次按键才真正定型，多数场景更稳（推荐）；直接替换：第一次按键直接上屏中文符号，再次按键删改为英文，交互更简洁，但在少数应用中兼容性略逊于组合态预览"
enabled_when = "input.symbol.smart_mode == true"
options = [
  { value = "hold_composition", label = "组合态预览（推荐）" },
  { value = "delete_replace", label = "直接替换" },
]

[[items]]
key = "input.symbol.smart_timeout_ms"
group = "input"
section = "字符与标点"
type = "slider"
label = "智能符号时限"
hint = "两次按键的最大间隔（毫秒）"
min = 100
max = 2000
step = 50
unit = "ms"
enabled_when = "input.symbol.smart_mode == true"

[[items]]
key = "input.symbol.smart_chars"
group = "input"
section = "字符与标点"
type = "dialog_button"
label = "智能符号字符集"
hint = "参与智能符号转换的中文标点集合"
gate_key = "input.symbol.smart_mode"

[[items]]
key = "input.punct.custom_enabled"
group = "input"
section = "字符与标点"
type = "toggle"
label = "启用自定义标点映射"
hint = "自定义英文标点的中文/全角替换；映射表在「自定义标点映射」对话框中编辑"

[[items]]
key = "input.punct.custom_mappings"
group = "input"
section = "字符与标点"
type = "dialog_button"
label = "自定义标点映射"
hint = "按英文半角/全角、中文半角/全角四态自定义标点替换；在表格对话框中逐格编辑"
gate_key = "input.punct.custom_enabled"

# ── 按键行为 ──
[[items]]
key = "input.enter_behavior"
group = "input"
section = "按键行为"
type = "select"
label = "回车键功能"
hint = "有编码时按回车键的处理方式"
options = [
  { value = "commit", label = "上屏编码" },
  { value = "clear", label = "清空编码" },
  { value = "commit_and_input", label = "上屏并继续输入" },
  { value = "ignore", label = "忽略" },
]

[[items]]
key = "input.space_on_empty_behavior"
group = "input"
section = "按键行为"
type = "select"
label = "空码时空格键功能"
hint = "无候选词时按空格键的处理方式"
options = [
  { value = "commit", label = "上屏编码" },
  { value = "clear", label = "清空编码" },
  { value = "commit_and_input", label = "上屏并继续输入" },
  { value = "ignore", label = "忽略" },
]

[[items]]
key = "input.numpad_behavior"
group = "input"
section = "按键行为"
type = "select"
label = "数字小键盘功能"
hint = "控制小键盘数字键的行为，选择「同主键盘区数字」后可用于候选选择和快捷输入"
options = [
  { value = "direct", label = "直接输入数字" },
  { value = "follow_main", label = "同主键盘区数字" },
]

# ── 候选无效按键 ──
[[items]]
key = "keys.overflow.number_key"
group = "input"
section = "候选无效按键"
type = "select"
label = "数字键无效时"
hint = "按的数字超出当前页候选数量时的处理方式"
options = [
  { value = "ignore", label = "不起作用" },
  { value = "commit", label = "上屏编码" },
  { value = "commit_and_input", label = "上屏并继续输入" },
]

[[items]]
key = "keys.overflow.select_key"
group = "input"
section = "候选无效按键"
type = "select"
label = "次选三选键无效时"
hint = "候选数量不足时按次选或三选键的处理方式"
options = [
  { value = "ignore", label = "不起作用" },
  { value = "commit", label = "上屏编码" },
  { value = "commit_and_input", label = "上屏并继续输入" },
]

[[items]]
key = "keys.overflow.select_char_key"
group = "input"
section = "候选无效按键"
type = "select"
label = "以词定字键无效时"
hint = "候选词长度不足时按以词定字键的处理方式"
options = [
