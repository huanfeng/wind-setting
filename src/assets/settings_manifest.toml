# ═══════════════════════════ 输入 ═══════════════════════════
# ── 字符与标点 ──
# 输入页的分节顺序（＝导航顺序）分三段，越靠前越"每天都在起作用"：
#   ① 字符形态：字符与标点 / 智能符号 / 标点配对 —— 打出来长什么样；
#   ② 临时模式：快捷输入 / 生僻字 —— 临时换一种打法；
#   ③ 特殊：简繁转换 / Emoji / 网址输入 / Unicode 输入 —— 候选或上屏结果另有来路；
#   末尾 联想 / 词频 是候选的后处理与统计口径，两块都不常改。
# 按键行为、候选无效按键在「按键」页（键按下去做什么集中在一页）；临时拼音、临时英文在
# 「方案」页（临时换一套方案打字，触发键、候选形态都是方案级的概念）。
