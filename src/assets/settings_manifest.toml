max = 8

[[items]]
key = "schema.pinyin.sentence_max_count"
group = "schema"
section = "候选行为"
dialog_group = "py_compose"
type = "number"
label = "智能组词备选条数"
hint = "一共算几种整句解读，供整句切换键轮换。少于显示条数时按显示条数算"
min = 1
max = 8

[[items]]
key = "schema.pinyin.sentence_cycle_key"
group = "schema"
section = "候选行为"
dialog_group = "py_compose"
type = "select"
label = "智能组词切换键"
hint = "打拼音时按它在几种整句解读间轮换，需把「智能组词备选条数」调到 2 以上。只在算出两条以上整句时占用这个键；它若是当前的音节分隔符（全拼下反引号常是）或被方案按键绑定，则让位不生效"
# ⚠️ value 必须与核心 `wind_keys::keymap` 的键名**逐字相同**（跨仓无校验，写错静默失效）。
# 核心按 `session_key_name_to_vk` 解析：tab 在会话功能键表、backtick 在符号键表。
[[items.options]]
value = ""
label = "不启用"
[[items.options]]
value = "tab"
label = "Tab"
[[items.options]]
value = "backtick"
label = "反引号 `"

# 分隔符是所有拼音方案共用的通用项，必须留在本 section 的**无 subsection 区**（即所有
# subsection 标题之前）。对话框渲染遇 subsection=None 不插标题、只是继续排在上一个
# 分组末尾，所以它一旦排到某个 subsection 之后，看起来就成了那个分组的成员。
[[items]]
key = "schema.pinyin.separator"
group = "schema"
section = "候选行为"
type = "select"
label = "拼音分隔符"
hint = "拼音模式下用于消歧的分隔符，如输入 xi'an 得到「西安」；自动模式默认用 '，当 ' 被选择键占用时改用 `"
options = [
  { value = "auto", label = "自动 ( ' / ` )" },
  { value = "quote", label = "单引号 ( ' )" },
  { value = "backtick", label = "反引号 ( ` )" },
  { value = "none", label = "不使用" },
]

# 词频调整
# 与码表那份（schema.codetable.single_char）是两件独立的事，互不影响。
[[items]]
key = "schema.pinyin.single_char"
group = "schema"
section = "候选行为"
type = "toggle"
label = "单字输入"
hint = "只出单字，用来找某个字；拼音没有定长码，日常不必开"

# 简拼（GH#180）
[[items]]
key = "schema.pinyin.abbrev.enabled"
group = "schema"
