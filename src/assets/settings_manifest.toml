[[items]]
key = "schema.mix.pinyin_only_overflow"
group = "schema"
section = "混输行为"
subsection = "拼音相关"
type = "toggle"
label = "超码长时仅查拼音"
hint = "编码超过最大码长时只显示拼音候选，不再查码表"
