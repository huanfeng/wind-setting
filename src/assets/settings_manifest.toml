# ═══════════════════════════ 统计 ═══════════════════════════
# 统计页的图表区不由清单驱动（见 pages/stats），仅这两个开关走通用行渲染。
[[items]]
key = "stats.enabled"
group = "stats"
section = "统计设置"
type = "toggle"
label = "启用输入统计"
hint = "开关输入统计功能"

[[items]]
key = "stats.track_english"
group = "stats"
section = "统计设置"
type = "toggle"
label = "统计英文输入"
hint = "是否统计英文模式下的输入"
enabled_when = "stats.enabled == true"
# macOS 无落点：英文模式下的输入由 Windows 侧 TSF DLL 经 CMD_INPUT_STATS 上报，
# macOS 的 `.app` 没有对应采集点，开关无论开关都统计不到。
platform = "windows"

# ═══════════════════════════ 高级 ═══════════════════════════
# ── 性能与诊断 ──
# 卡片里在本项之后另接一行手写的「内存占用」摘要 +「诊断信息…」对话框（只读诊断，
# `system.memoryStats`），见 `pages/memory.rs`；拼接在 `advanced_page` 里做。
# 分区名与 `memory::SECTION` 必须一致，改一处要同改另一处。
[[items]]
key = "schema.keep_all_loaded"
group = "advanced"
section = "性能与诊断"
type = "toggle"
label = "常驻所有方案"
hint = "开启：所有方案预先加载并留在内存里，切换方案零等待。关闭：只加载用到的方案，30 分钟不用自动卸载，省内存"

# ── 游戏兼容 ──
[[items]]
key = "system.dota2_compat"
group = "advanced"
section = "游戏兼容"
type = "toggle"
label = "Valve 游戏兼容模式（Dota2 等）"
# 落点是 Windows 注册表（TSF 输入法显示名，dota2_compat::apply），Linux 无从谈起。
# ⚠️ macOS 同样无落点（probe 恒 None、apply 恒报错），但门控它会改变 mac 现有行为，
# 不在 Linux 适配的范围内，故暂按 "windows, macos" 保持 mac 原样。
platform = "windows, macos"
hint = "部分 Valve 游戏（如 Dota 2）只给内置名单里的输入法绘制候选，本输入法不在名单内，因此游戏里看不到候选、还会多出一个左上角小窗。开启后本输入法在系统里登记的名称会改为下面填的那个，语言栏与 Windows 设置里也显示该名称；需管理员权限，重启游戏后生效"

# ⚠️ 刻意**不加** enabled_when：用户多半是「先把名字改成想试的那条，再开开关」，
# 跟着开关置灰会逼出「先开 → 弹一次 UAC 写错名字 → 改名 → 再弹一次」的两遍提权。
# 名称本身不生效于系统，真正落地的动作挂在上面那个开关上。
[[items]]
key = "system.dota2_compat_name"
group = "advanced"
section = "游戏兼容"
type = "string"
label = "登记名称"
platform = "windows, macos"
hint = "开启上面的开关后向系统登记的名称，必须与游戏内置名单里的某一条逐字一致，差一个字符就不生效且没有任何报错（名单里多数条目形如「中文 (简体) - 郑码」，抄的时候当心全角括号与多余空格）。留空则用默认的「拼音输入法」。换成名单里别的名字可能改变游戏内的行为（例如上屏后的第一个退格会不会被吞），需自行实测"

# ── 日志设置 ──
# 放在本页**最后**：三项都只在排查时才动，日常使用频度极低。
#
# 三个模块的落点各不相同（理由见 manifest.rs 的 `local_field`）：
#   输入法服务 → core config.toml 的 debug.log_level（普通 select）
#   TSF DLL    → <日志根>/tsf_log_config（local_select，DLL 在 DllMain 里就要读到）
#   设置程序   → wind_setting.toml 的 [log] level（local_select，logger 早于 RPC）
# 但三者的日志文件都落在同一个 logs 目录下，故「打开」入口只要一个，不必每行挂一个。

[[items]]
key = "local.log_privacy_note"
group = "advanced"
section = "日志设置"
# 只在某个级别被调到 debug/trace 时才出现（橙色），平时整行不占位。
# 恒常的灰字提示会被整片略读掉，而这是这一屏唯一需要用户停下来看的一句。
type = "log_privacy_warning"
label = "隐私提示"
hint = "当前级别会把输入内容记进日志，存在信息泄露风险；排查完请调回 info 或关闭"

[[items]]
key = "debug.log_level"
group = "advanced"
section = "日志设置"
type = "log_level_select"
label = "输入法服务日志级别"
hint = "重启输入法服务后生效；关闭后连启动轨迹文件也不再写入"
options = [
  { value = "off", label = "关闭" },
  { value = "error", label = "error" },
  { value = "warn", label = "warn" },
  { value = "info", label = "info" },
  { value = "debug", label = "debug" },
  { value = "trace", label = "trace" },
]

[[items]]
key = "local.tsf_log_level"
group = "advanced"
section = "日志设置"
type = "local_select"
label = "TSF 端日志级别"
hint = "重启使用中的程序后生效（DLL 常驻在各宿主进程内）"
# macOS 没有 TSF：那边的输入法层是 IMKit，日志随主程序走，没有对应落点。
platform = "windows"
options = [
  { value = "off", label = "关闭" },
  { value = "error", label = "error" },
  { value = "warn", label = "warn" },
  { value = "info", label = "info" },
  { value = "debug", label = "debug" },
  { value = "trace", label = "trace" },
]

[[items]]
key = "local.tsf_log_mode"
group = "advanced"
section = "日志设置"
type = "local_select"
label = "TSF 端日志输出方式"
hint = "DebugString 需配合 DebugView.exe 查看"
platform = "windows"
# 仅 dev 变体可见：DebugString 那一档要靠外部工具才看得见，正式版里只会让人选中一个
# 「看起来没生效」的选项。正式版恒为「写入文件」（tsf_log_config 里手写 mode 仍然有效）。
variant = "dev"
options = [
  { value = "file", label = "写入文件" },
  { value = "debugstring", label = "DebugString" },
]

[[items]]
key = "local.setting_log_level"
group = "advanced"
section = "日志设置"
type = "local_select"
label = "设置程序日志级别"
hint = "重启设置程序后生效"
options = [
  { value = "off", label = "关闭" },
  { value = "error", label = "error" },
  { value = "warn", label = "warn" },
  { value = "info", label = "info" },
  { value = "debug", label = "debug" },
  { value = "trace", label = "trace" },
]

[[items]]
key = "local.open_dirs"
group = "advanced"
section = "日志设置"
type = "open_dirs"
label = "打开目录"
hint = "用户数据含配置与词库；TSF 端日志在日志目录的 tsf_log 子目录"

[[items]]
key = "local.log_archive"
group = "advanced"
section = "日志设置"
type = "log_archive"
label = "日志打包"
hint = "反馈问题时把整个日志目录打成一个 zip 发给维护者；清理会删除全部日志"
