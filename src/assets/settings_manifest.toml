  { value = "rbracket", label = "右方括号 ( ] )" },
]

# 候选来源：与触发键读写同一个 core 键（schema.mix_modes 里 quick_mix 的 members），
# 故用视图 key `#members` 另立一项——清单按 key 索引，同 key 两项后者会覆盖前者。
# value = core 成员 id；声明序 = 新增成员的插入位置，须与 core 的 default_mix_modes() 一致
# （由 mix_members_options_match_core_default_order 守护）。
# 「可选但出厂不启用」的成员（quick_input.history / $rare_char）也声明在此：它们不在
# default_mix_modes() 里，界面按声明序补位、显示为未勾选，用户自己勾上才生效。
[[items]]
key = "schema.mix_modes#members"
group = "input"
section = "快捷输入"
type = "dialog_button_mix_members"
label = "快捷候选来源"
hint = "快捷输入模式下出哪些候选。关掉的来源不再产出候选；列表顺序即候选优先级，按住行首手柄上下拖动即可调整"
options = [
  { value = "quick_input.calc", label = "计算", hint = "算式求值，如 1+2*3、5^2、(1+2)/4" },
  { value = "quick_input.number", label = "数字 / 金额", hint = "中文数字、财务大写、千分位；算式结果也会转换" },
  { value = "quick_input.date", label = "日期 / 年月", hint = "如 2026.3.5 → 2026年3月5日；12.25 → 12月25日。只有一个点时数字候选在前，多打一个点（12.25.）使日期优先" },
  { value = "quick_input.repeat", label = "重复上次上屏", hint = "仅在刚进入、尚未输入时出现，空格即再上屏一次" },
  { value = "$primary_pinyin", label = "拼音", hint = "跟随主拼音方案（全拼/双拼）" },
  { value = "english", label = "英文", hint = "英文词库候选" },
  { value = "quick_input.history", label = "快捷输入历史", hint = "按前缀补全以前在快捷输入里上屏过的文本，如 ${reset_time}、RESET_TIME。所打内容带符号或大写时，历史排在原文之前；回车仍上屏原文。出厂不启用" },
  { value = "$rare_char", label = "生僻字", hint = "用当前方案的编码打生僻字，只出单字。排在拼音之后时，同一个字会先被拼音取走；需要优先显示则前移" },
]

# 候选布局：与触发键、候选来源读写同一个 core 键（schema.mix_modes 里 quick_mix 的
# candidate_layout），故用视图 key `#candidate_layout` 另立一项。
# 取代旧的 schema.quick_input.force_vertical——那个布尔挂在与实例无关的全局段，
# 且表达不了「全局竖排但本模式横排」。三个模式的选项须一致（见下方临拼/临英/网址）。
[[items]]
key = "schema.mix_modes#candidate_layout"
group = "input"
section = "快捷输入"
type = "select_mix_layout"
label = "候选窗布局"
hint = "快捷输入期间候选窗的排列方向；退出后自动恢复。跟随全局 = 用外观页的候选布局设置"
width = 210
options = [
  { value = "follow", label = "跟随全局" },
  { value = "vertical", label = "强制竖排" },
  { value = "horizontal", label = "强制横排" },
]

# 自由（字面）输入：与上面三项读写同一个 core 键（schema.mix_modes 里 quick_mix 的
# free_input），故用视图 key `#free_input` 另立一项。
[[items]]
key = "schema.mix_modes#free_input"
group = "input"
section = "快捷输入"
type = "select_mix_free_input"
label = "自由输入"
hint = "把不可能是编码的按键（大写字母、多数符号，以及一个候选都没有时的选词键）作字面输入，原样上屏；开启后标点不再顶屏候选"
width = 210
options = [
  { value = "off", label = "关闭" },
  { value = "auto", label = "自动判断" },
  { value = "always", label = "始终字面输入" },
]

# 夺取二三候选键：同上，视图 key `#free_input_takes_select_keys`。
# enabled_when 用 `!=` —— 该算子是为本项加的（parse_conds 原先只有 == 与 contains）。
[[items]]
key = "schema.mix_modes#free_input_takes_select_keys"
group = "input"
section = "快捷输入"
type = "checkbox_mix_free_select_keys"
indent = false
label = "; ' 作字面字符"
hint = "自由输入时 ; ' 不再选第 2/3 候选。数字键 1-9 只在一个候选都没有时才作字面"
enabled_when = "schema.mix_modes#free_input != off"

[[items]]
key = "schema.quick_input.decimal_places"
group = "input"
section = "快捷输入"
type = "number"
label = "小数保留位数"
hint = "计算结果最多保留的小数位数（0 表示取整）"
min = 0
max = 6

# 候选来源「快捷输入历史」的条数上限，与网址历史 input.url.history_max 同一套裁剪。
[[items]]
key = "schema.quick_input.history_max"
group = "input"
section = "快捷输入"
