# 统一声明式设置清单（core/setting/web 共用真相源）
# core 解析后注入 app/engine/variant，经 system.manifest 暴露为 JSON（items 原样透传）。
# 字段：key(点路径,对应 Config)/group/section/type/label/hint/since/options/min/max/step/unit/enabled_when
# 注：默认值不在此声明，统一取自 core capability 快照（capabilities.snapshot.json）。
#
# 【对照来源】wind-config/src/config.rs（权威）。key 必须与真实配置点路径逐字一致。
# 【分组】group → Tab（方案/输入/快捷键/外观/常规/高级）；section → Tab 内子卡片。
#   前端按 (group, section) 聚合：同 section 的项渲染为一张卡片，section 首次出现序为卡片序。
# 【未进清单·待对话框承载】hotkeys 键位合成(目前以 string 暴露)、
#   schema.active/available（方案管理）、features.special_modes/mix_modes、
#   各 *.trigger_keys / *_keys 键组、compat.host_render_processes。
# 【动态可选值】select 项可用 options_source（如 codetableSchemas/pinyinSchemas/fonts）声明选项来源，
#   选项由前端运行时从 schema.list / system.fonts 填充；此类项恒渲染为下拉。


# ── 分组（→ web 页面/Tab、setting 导航）──
[[groups]]
key = "schema"
label = "方案"
order = 1

[[groups]]
key = "input"
label = "输入"
order = 2

[[groups]]
key = "keys"
label = "快捷键"
order = 3

[[groups]]
key = "ui"
label = "外观"
order = 4

[[groups]]
key = "general"
label = "常规"
order = 5

[[groups]]
key = "advanced"
label = "高级"
order = 6

