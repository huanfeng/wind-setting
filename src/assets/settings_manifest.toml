# ── 外观·状态提示（补全）──
[[items]]
key = "ui.status.enabled"
group = "ui"
section = "状态提示"
type = "toggle"
label = "启用状态提示气泡"
hint = "切换中英/方案等时弹出状态气泡"

[[items]]
key = "ui.status.duration"
group = "ui"
section = "状态提示"
type = "number"
label = "状态气泡显示时长"
hint = "临时显示模式下气泡停留时间"
min = 0
max = 5000
unit = "ms"
enabled_when = "ui.status.enabled == true"

[[items]]
key = "ui.status.display_mode"
group = "ui"
section = "状态提示"
type = "select"
label = "状态气泡显示模式"
enabled_when = "ui.status.enabled == true"
options = [
  { value = "temp", label = "临时显示" },
  { value = "always", label = "常驻显示" },
]

[[items]]
key = "ui.status.position_mode"
group = "ui"
section = "状态提示"
type = "select"
label = "状态气泡定位方式"
enabled_when = "ui.status.enabled == true"
options = [
  { value = "follow_caret", label = "跟随光标" },
  { value = "fixed", label = "固定位置" },
]

[[items]]
key = "ui.status.custom_x"
group = "ui"
section = "状态提示"
type = "number"
label = "固定位置 X"
hint = "固定定位时气泡屏幕横坐标（像素）"
min = -4000
max = 4000
enabled_when = "ui.status.position_mode == fixed"

[[items]]
key = "ui.status.custom_y"
group = "ui"
section = "状态提示"
type = "number"
label = "固定位置 Y"
hint = "固定定位时气泡屏幕纵坐标（像素）"
min = -4000
max = 4000
enabled_when = "ui.status.position_mode == fixed"

