key = "ui.candidate.position_mode"
group = "ui"
section = "候选窗口"
type = "select"
label = "定位方式"
hint = "跟随光标=候选窗随输入位置移动；固定位置=停在屏幕固定处，不再随光标跑动。固定位置下直接拖动候选窗即可摆放，位置自动记住"
options = [
  { value = "follow_caret", label = "跟随光标" },
  { value = "fixed", label = "固定位置" },
]

[[items]]
key = "ui.candidate.first_show_mode"
group = "ui"
section = "候选窗口"
type = "select"
label = "首次显示时机"
hint = "每串新输入的候选窗多快出现；应用给不出准确位置时，「快速」与「立即」会先按上次的位置显示。可在右键菜单里为单个应用单独设"
options = [
  { value = "fast", label = "快速显示" },
  { value = "wait", label = "等待精确坐标（较慢）" },
  { value = "instant", label = "立即显示（最快，可能抖动）" },
]

[[items]]
key = "ui.candidate.preedit_display"
group = "ui"
section = "候选窗口"
type = "select"
label = "编码显示方式"
hint = "编码（组合区）的显示位置；「内嵌应用光标处」时候选窗不显示编码栏"
options = [
  { value = "app_inline", label = "内嵌应用光标处" },
  { value = "candidate_top", label = "候选窗顶部独立栏" },
  { value = "candidate_inline", label = "候选窗首单元内联" },
]

[[items]]
key = "ui.candidate.layout"
group = "ui"
section = "候选窗口"
type = "segmented"
label = "候选窗排列"
hint = "候选词的排列方式"
[[items.options]]
value = "horizontal"
label = "横排"
[[items.options]]
value = "vertical"
label = "竖排"

[[items]]
key = "ui.candidate.flip_when_above"
group = "ui"
section = "候选窗口"
type = "toggle"
label = "候选窗在上方时反转候选顺序"
hint = "候选窗显示在光标上方时，反转候选项的排列顺序（使第一候选靠近光标）；可与「编码栏置底」叠加。仅竖排 +「跟随光标」定位下生效"

[[items]]
key = "ui.candidate.swap_preedit_when_above"
group = "ui"
section = "候选窗口"
type = "toggle"
label = "候选窗在上方时编码栏置底"
hint = "候选窗显示在光标上方时，将编码栏与候选栏上下调换，使编码栏沉到底部贴近光标。仅「跟随光标」定位下生效"

[[items]]
key = "ui.candidate.pager_in_preedit"
group = "ui"
section = "候选窗口"
type = "toggle"
label = "翻页栏并入编码栏"
hint = "将翻页栏右对齐显示在编码栏行（竖排可省一行）；仅「编码显示方式」为「候选窗顶部独立栏」时生效"

[[items]]
key = "ui.candidate.max_chars"
group = "ui"
section = "候选窗口"
type = "number"
label = "候选文本最大字数"
hint = "候选文本超过此字数时截断并追加省略号；0 = 不限"
min = 0
max = 64

# 候选窗尺寸下限段：五项都是「窗口别缩得比这更小」的同一件事，且都不常改——摊在卡片上
# 五行连排会把「候选窗排列」「最大字数」这些天天要动的项挤没。故卡片上只占一行
# 「候选窗口最小大小 …… [设置]」，五项全在对话框里（`dialog_title` 宿主 + `dialog_extra_for`
# 寄居，见 manifest.rs 的 build_grouped_dialog_row）。
#
# 宿主取**横排最小宽度**：它是对话框里第一个字段，也是最常配的一项——横排候选窗随候选
# 字数忽宽忽窄，"宽度别再跳"是这组设置最主要的用途。
#
# 下限量的是整个窗口（含翻页栏、编码栏），候选照常紧凑排列、凑不满的部分留空。
# 横排/竖排各配一套——两种排布的可用空间差一个数量级。
[[items]]
key = "ui.candidate.min_window_width_horizontal"
group = "ui"
section = "候选窗口"
type = "number"
label = "横排最小宽度（dp）"
hint = "窗口不足此宽时右侧留空，候选本身不拉伸；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_title = "候选窗口最小大小"
dialog_hint = "为候选窗设定宽高下限，避免窗口随候选内容忽大忽小；横排、竖排各自一套"
# 单位「（dp）」写进 label 而不是 hint：对话框只有 460 宽，hint 会被截成一行（截断处
# 有 tooltip 兜底看全文），单位藏在截断后面等于没写——而不知道填的是像素还是字数，
# 这一格根本没法填。清单的 `unit` 字段目前无人消费（见 manifest.rs 的 MItem::unit）。

[[items]]
key = "ui.candidate.min_window_width_vertical"
group = "ui"
section = "候选窗口"
type = "number"
label = "竖排最小宽度（dp）"
hint = "窗口不足此宽时右侧留空，候选高亮跟随窗口铺满；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_extra_for = "ui.candidate.min_window_width_horizontal"

[[items]]
key = "ui.candidate.min_window_height_horizontal"
group = "ui"
section = "候选窗口"
type = "number"
label = "横排最小高度（dp）"
hint = "窗口不足此高时留空；窗口在光标上方时空白补在顶部；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_extra_for = "ui.candidate.min_window_width_horizontal"

[[items]]
key = "ui.candidate.min_window_height_vertical"
group = "ui"
section = "候选窗口"
type = "number"
label = "竖排最小高度（dp）"
hint = "窗口不足此高时留空，翻页栏的出现消失一并吸收；0 = 不限，跟随内容"
min = 0
max = 1200
dialog_extra_for = "ui.candidate.min_window_width_horizontal"

[[items]]
key = "ui.candidate.min_rows"
group = "ui"
section = "候选窗口"
type = "number"
label = "竖排最小行数"
hint = "候选数不足时补透明空行以保持候选区高度；自动钳到每页候选数；0 = 不限。仅竖排生效"
min = 0
max = 9
dialog_extra_for = "ui.candidate.min_window_width_horizontal"

# 候选注释段（候选右侧灰字）：卡片上只占一行「候选注释 …… [设置]」，三个字段与模板参考
# 全在对话框里（专用 builder，见 manifest.rs 的 COMMENT_HOST_KEY）。
# 宿主取**横排**模板：它是对话框里第一个出现的字段，而横排宽度由全部候选共享、最需斟酌。
# 卡片行的 hint 保持一句话——模板语法属于对话框里的事，摊在卡片上没人看得完。
[[items]]
key = "ui.candidate.comment_template_horizontal"
group = "ui"
section = "候选窗口"
type = "dialog_button"
label = "候选注释"
hint = "候选词右侧灰字显示的内容，横排与竖排可分别设置"

[[items]]
key = "ui.candidate.comment_template_vertical"
group = "ui"
section = "候选窗口"
type = "string"
label = "竖排注释"
hint = "竖排候选窗每行独占一行，可放较长的注音或字根"
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.candidate.comment_max_chars_horizontal"
group = "ui"
section = "候选窗口"
type = "number"
label = "横排最大字数"
hint = "超过此字数时截断并加省略号；0 = 不限"
min = 0
max = 64
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.candidate.comment_max_chars_vertical"
group = "ui"
section = "候选窗口"
type = "number"
label = "竖排最大字数"
hint = "竖排每行独占，通常可比横排放宽；0 = 不限"
min = 0
max = 64
dialog_extra_for = "ui.candidate.comment_template_horizontal"

[[items]]
key = "ui.comment_dicts"
group = "ui"
section = "候选窗口"
type = "dialog_button_comment_dicts"
label = "注释词库"
hint = "供注释模板 ${dict} 变量查询；词库文件放在数据目录的 schemas/comments/ 下"

[[items]]
key = "ui.candidate.index_labels"
group = "ui"
section = "候选窗口"
type = "dialog_button"
label = "自定义序号标签"
hint = "为序号 1-10 自定义标签（每框一个完整标签，可多字符）；在对话框中逐框填写，留空用默认 1-9"

# 注：ui.candidate.custom_x / custom_y（固定位置坐标）刻意不在此暴露——与 ui.status 同一决策：
# 固定位置由「拖动候选窗」直接设定并自动落盘，手填屏幕绝对坐标既不直观、又与拖动结果互相覆盖。
# 主流输入法（搜狗、Google 拼音）同样只提供「是否跟随光标」开关，不提供坐标输入。
# 尚未拖动过时（坐标为 0,0）候选窗落在屏幕下方居中的默认锚点。配置键仍在 config.toml 中保留。

# 注：input.cmdbar.enabled（命令栏开关）不在设置端暴露——命令栏始终开启（core 默认 true），
# 不提供关闭入口；故仅保留前缀配置。
[[items]]
key = "input.cmdbar.candidate_prefix"
group = "ui"
section = "候选窗口"
type = "string"
label = "命令栏候选前缀"
hint = "命令候选前的提示符号"

# ── 候选项提示信息 ──
[[items]]
key = "ui.tooltip.delay"
group = "ui"
section = "候选项提示信息"
type = "number"
label = "悬停延时"
hint = "鼠标停留在候选上多久后弹出提示框（毫秒）；越大越不易误触"
min = 0
max = 2000
step = 50
unit = "ms"

[[items]]
key = "ui.tooltip.code_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "编码反查"
hint = "悬停候选时在主码表中反查该词的标准编码并显示"

[[items]]
key = "ui.tooltip.pinyin_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "拼音反查"
hint = "悬停候选词时显示拼音读音（多音字全部列出）"

[[items]]
key = "ui.tooltip.pinyin_heteronyms"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "显示多音字所有读音"
hint = "关闭则仅显示首音"
enabled_when = "ui.tooltip.pinyin_enabled == true"

# 注：ui.tooltip.pinyin_max_readings（每字最多读音数）当前不支持，已移除（由 core 维持默认）。

[[items]]
key = "ui.tooltip.chaizi_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "拆字反查"
hint = "悬停候选词时显示字根拆字信息（需方案支持）"

[[items]]
key = "ui.tooltip.debug_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "调试信息"
hint = "悬停候选词时显示编码来源、权重等调试元数据"

# ── 状态提示（行为/位置类；纯视觉如颜色/字号/透明度/圆角由主题 theme.toml 处理，不在此）──
[[items]]
key = "ui.status.enabled"
group = "ui"
section = "状态提示"
type = "toggle"
label = "启用状态提示气泡"
hint = "切换输入状态时显示提示气泡"

[[items]]
key = "ui.status.display_mode"
group = "ui"
section = "状态提示"
type = "select"
label = "显示模式"
hint = "临时显示在切换时闪现后自动消失，常驻显示在有输入焦点时始终显示；右键气泡可快速切换"
enabled_when = "ui.status.enabled == true"
options = [
  { value = "temp", label = "临时显示" },
  { value = "always", label = "常驻显示" },
]

[[items]]
key = "ui.status.show_on_focus"
group = "ui"
section = "状态提示"
type = "toggle"
label = "焦点切换时显示"
hint = "切换到别的输入框时也提示一次当前状态；跟随光标定位下，取不到精确插入点的应用不显示，避免弹在错误位置"
# 常驻显示本就在获焦时显示，此项对它没有额外效果，故仅在临时显示下可用（与「显示时长」同条件）。
enabled_when = "ui.status.enabled == true && ui.status.display_mode == temp"

[[items]]
key = "ui.status.duration"
group = "ui"
section = "状态提示"
type = "number"
label = "显示时长"
hint = "气泡停留时间；鼠标悬停、拖动或打开右键菜单期间会顺延，不会中途消失"
min = 0
max = 5000
unit = "ms"
enabled_when = "ui.status.enabled == true && ui.status.display_mode == temp"

[[items]]
key = "ui.status.items"
group = "ui"
section = "状态提示"
type = "checkbox_group"
label = "显示内容"
hint = "勾选状态气泡里显示哪些内容；全部取消则不显示气泡"
enabled_when = "ui.status.enabled == true"
[[items.options]]
value = "schema"
label = "输入方案"
[[items.options]]
value = "punct"
label = "标点状态"
[[items.options]]
value = "full_width"
label = "全半角状态"
[[items.options]]
value = "s2t"
label = "简繁状态"
[[items.options]]
value = "caps"
label = "大写锁定"

[[items]]
key = "ui.status.schema_name_style"
group = "ui"
section = "状态提示"
type = "select"
label = "方案名显示样式"
hint = "上方勾选「输入方案」后生效；图标短称取方案 icon_label，无则回退全名"
enabled_when = "ui.status.enabled == true && ui.status.items contains schema"
options = [
  { value = "full", label = "全名" },
  { value = "short", label = "图标短称" },
]

[[items]]
key = "ui.status.position_mode"
group = "ui"
section = "状态提示"
type = "select"
label = "定位方式"
hint = "固定位置下可直接拖动气泡摆放，右键气泡可切换定位方式或恢复默认位置"
enabled_when = "ui.status.enabled == true"
opens_dialog = "status_position"
options = [
  { value = "follow_caret", label = "跟随光标" },
  { value = "fixed", label = "固定位置" },
]

[[items]]
key = "ui.status.offset_x"
group = "ui"
section = "状态提示"
type = "number"
label = "水平偏移"
hint = "相对光标下方（左边缘对齐光标）的水平偏移（像素，正=右）"
min = -400
max = 400
enabled_when = "ui.status.position_mode == follow_caret"
dialog_group = "status_position"

[[items]]
key = "ui.status.offset_y"
group = "ui"
section = "状态提示"
type = "number"
label = "垂直偏移"
hint = "相对光标下方的垂直偏移（像素，正=下）"
min = -400
max = 400
enabled_when = "ui.status.position_mode == follow_caret"
dialog_group = "status_position"

# 注：ui.status.custom_x / custom_y（固定位置坐标）刻意不在此暴露——固定位置由「拖动气泡」
# 直接设定，右键菜单「固定位置」开关会以气泡当前实际位置落盘，「恢复默认位置」可复位。
# 让用户手填屏幕绝对坐标既不直观、又与拖动结果互相覆盖。配置键本身仍在 config.toml 中保留。

# ── 模式指示 ──
[[items]]
key = "ui.mode_indicator.style"
group = "ui"
section = "模式指示"
type = "select"
label = "模式指示样式"
hint = "进入临拼/双拼/快符/英文等模式时的标识；短称即 拼/双/快/英/符"
options = [
  { value = "short", label = "短称" },
  { value = "full", label = "全称" },
  { value = "none", label = "不显示" },
]

# ── 工具栏 ──
[[items]]
key = "ui.toolbar.visible"
group = "ui"
section = "工具栏"
type = "toggle"
label = "显示状态栏"
# 文案刻意写成平台中立：本项在 Windows 上控制可拖动的浮动工具栏，在 macOS 上控制
# 菜单栏指示器——两者形态不同但语义一致（“输入法的常驻状态显示”），故不提“可拖动”
# 之类只在一边成立的描述。清单当前不支持分平台文案，写通用的即可。
hint = "常驻显示输入法当前状态（中英、全半角、标点、方案）"

# 带 platform = "windows" 的几项：macOS 用菜单栏指示器，既不是浮动窗口也无法排列/自动隐藏。
# （ui.toolbar.visible 不在此列——它在 macOS 上控制指示器的显示与否，是有落点的。）
[[items]]
key = "ui.toolbar.hide_in_fullscreen"
group = "ui"
section = "工具栏"
type = "toggle"
label = "全屏时隐藏工具栏"
hint = "当前台应用进入全屏（游戏、视频、演示等）时自动隐藏工具栏"
platform = "windows"

[[items]]
key = "ui.toolbar.vertical"
group = "ui"
section = "工具栏"
type = "toggle"
label = "纵向排列"
hint = "工具栏竖着摆放；适合把它靠在屏幕左右两侧"
platform = "windows"

# 显示哪些格 + 顺序。用 ordered_pairs 而非 checkbox_group：core 侧**数组顺序即渲染顺序**，
# 而 checkbox_group 恒按声明序写回，会静默改写用户拖出来的顺序（config-design-rules §R3）。
# value = core 的条目键，声明序 = 出厂顺序，须与主仓 TOOLBAR_ITEM_KEYS 一致。
[[items]]
key = "ui.toolbar.items"
group = "ui"
section = "工具栏"
type = "dialog_button_ordered_pairs"
label = "显示内容"
hint = "工具栏上显示哪些内容、按什么顺序；按住行首手柄上下拖动即可调整"
platform = "windows"
options = [
  { value = "mode", label = "中英 / 方案", hint = "显示当前是中文还是英文，中文时显示方案标签（拼、五等）；点击切换中英，右键选方案，中键直接切到下一个方案" },
  { value = "punct", label = "标点", hint = "中文标点还是英文标点；点击切换，右键可一并调整全半角与简繁" },
  { value = "full_width", label = "全 / 半角", hint = "满月＝全角、弯月＝半角；点击切换，右键可一并调整标点与简繁" },
  { value = "s2t", label = "简 / 繁", hint = "简入繁出的开关，点击切换；出厂关着" },
  { value = "soft_keyboard", label = "软键盘", hint = "键盘按钮，点击开关软键盘面板；右键可直接选一种键盘" },
  { value = "settings", label = "设置", hint = "齿轮按钮，点击打开功能菜单。隐藏它也不影响使用——右键工具栏任意位置同样能打开菜单" },
]

[[items]]
key = "ui.toolbar.auto_hide"
group = "ui"
section = "工具栏"
type = "toggle"
label = "自动隐藏工具栏"
hint = "工具栏显示一段时间无交互后淡出隐藏；鼠标悬停不隐藏，切换中英等状态变化时重新显示"
platform = "windows"

[[items]]
key = "ui.toolbar.auto_hide_delay"
group = "ui"
section = "工具栏"
type = "number"
label = "自动隐藏延时"
hint = "工具栏显示多久后开始淡出（秒）"
min = 1
max = 60
unit = "s"
enabled_when = "ui.toolbar.auto_hide == true"
platform = "windows"

# 宿主行 = 角标总开关下拉 + 「设置…」按钮，尺寸与不透明度进分组对话框；
# 规则表另起一行（它自己就是个带增删的列表，塞不进分组对话框）。
# 宿主行必须带一个值控件（build_dialog_group_row 恒调 build_control），做不出纯标签+按钮
# 的行；总开关是这组里最常改的一项，故由它当宿主。
[[items]]
key = "ui.langbar.badge"
group = "ui"
section = "任务栏图标"
type = "select"
label = "状态角标"
hint = "在任务栏图标的角上叠加状态标记；关掉则全不显示"
options = [
  { value = "none", label = "不显示" },
  { value = "corner", label = "角标" },
]
opens_dialog = "langbar_badge"
platform = "windows"

[[items]]
key = "ui.langbar.badge_scale"
group = "ui"
section = "任务栏图标"
type = "slider"
label = "角标大小"
hint = "所有角标的大小倍率；单条可在规则里再调"
min = 0.1
max = 3.0
step = 0.1
dialog_group = "langbar_badge"
platform = "windows"

# 步长 0.02 而不是 0.05 / 0.1：出厂值 0.88 必须落在格子上（0.3 + 0.02×29），
# 否则从默认值点一下就跳到一个"回不去"的值。
# ⚠️ hint 必须一行装得下（约 24 字），超出会被省略号截掉——而末端 1.0 的跳变
# （变实心并挖字）正是调之前必须知道的一句，被截等于没写。
[[items]]
key = "ui.langbar.badge_alpha"
group = "ui"
section = "任务栏图标"
type = "slider"
label = "角标透明度"
hint = "越小越透；调到 1 变实心，并挖掉周围一圈主字"
min = 0.3
max = 1.0
step = 0.02
dialog_group = "langbar_badge"
platform = "windows"

[[items]]
key = "ui.langbar.badges"
group = "ui"
section = "任务栏图标"
type = "dialog_button_langbar_badges"
label = "角标规则"
hint = "哪些状态画角标、画在哪个角、什么颜色"
enabled_when = "ui.langbar.badge != none"
platform = "windows"

# ═══════════════════════════ 常规（并入「输入」页尾「默认状态」）═══════════════════════════
[[items]]
key = "input.default.state_scope"
group = "general"
section = "默认状态"
type = "select"
label = "中英状态作用域"
hint = "全局统一：所有应用共享同一中英状态；按应用独立：每个应用各自记忆中英文（适合游戏等需保持英文的场景，重启输入法后重置）"
options = [
  { value = "global", label = "全局统一" },
  { value = "app", label = "按应用独立" },
]

[[items]]
key = "input.default.remember_last_state"
group = "general"
section = "默认状态"
type = "toggle"
label = "记忆前次状态"
hint = "启用后恢复上次的中英文、全半角和标点状态"

[[items]]
key = "input.default.chinese_mode"
group = "general"
section = "默认状态"
type = "segmented"
label = "初始语言模式"
hint = "每次激活输入法时的默认语言（开启「记忆前次状态」后此项不生效）"
enabled_when = "input.default.remember_last_state == false"
options = [{ value = "false", label = "英文" }, { value = "true", label = "中文" }]

[[items]]
key = "input.default.full_width"
group = "general"
section = "默认状态"
type = "segmented"
label = "初始字符宽度"
hint = "每次激活输入法时的默认字符宽度（开启「记忆前次状态」后此项不生效）"
enabled_when = "input.default.remember_last_state == false"
options = [{ value = "false", label = "半角" }, { value = "true", label = "全角" }]

[[items]]
key = "input.default.chinese_punct"
group = "general"
section = "默认状态"
type = "segmented"
label = "初始标点模式"
hint = "每次激活输入法时的默认标点类型（开启「记忆前次状态」后此项不生效）"
enabled_when = "input.default.remember_last_state == false"
options = [
  { value = "false", label = "英文标点" },
  { value = "true", label = "中文标点" },
]

# ═══════════════════════════ 统计 ═══════════════════════════
# 统计页的图表区不由清单驱动（见 pages/stats），仅这两个开关走通用行渲染。
[[items]]
key = "stats.enabled"
group = "stats"
section = "统计设置"
type = "toggle"
label = "启用输入统计"
hint = "开关输入统计功能"

[[items]]
key = "stats.track_english"
group = "stats"
section = "统计设置"
type = "toggle"
label = "统计英文输入"
hint = "是否统计英文模式下的输入"
enabled_when = "stats.enabled == true"
# macOS 无落点：英文模式下的输入由 Windows 侧 TSF DLL 经 CMD_INPUT_STATS 上报，
# macOS 的 `.app` 没有对应采集点，开关无论开关都统计不到。
platform = "windows"

# ═══════════════════════════ 高级 ═══════════════════════════
# ── 日志设置 ──
[[items]]
key = "debug.log_level"
group = "advanced"
section = "日志设置"
type = "select"
label = "服务日志级别"
hint = "重启输入法服务后生效"
options = [
  { value = "error", label = "error" },
  { value = "warn", label = "warn" },
  { value = "info", label = "info" },
  { value = "debug", label = "debug" },
  { value = "trace", label = "trace" },
]

# ── 游戏兼容 ──
[[items]]
key = "system.dota2_compat"
group = "advanced"
section = "游戏兼容"
type = "toggle"
label = "Valve 游戏兼容模式（Dota2 等）"
hint = "部分 Valve 游戏（如 Dota 2）只给内置名单里的输入法绘制候选，本输入法不在名单内，因此游戏里看不到候选、还会多出一个左上角小窗。开启后本输入法在系统里登记的名称会改为「中文 (简体) - 郑码」，语言栏与 Windows 设置里也显示该名称；需管理员权限，重启游戏后生效"
