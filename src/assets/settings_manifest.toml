# 统一声明式设置清单（native 内置真相源；core 已退役 manifest.toml）。
# 字段：key(点路径,对应 Config)/group/section/type/label/hint/options/options_source/min/max/step/unit/width/enabled_when/gate_key/global
#   width：select 下拉像素宽；options_source：动态选项来源（themes/fonts/codetableSchemas/pinyinSchemas）
# 注：默认值不在此声明，统一取自 core capability 快照（capabilities.snapshot.json）。
#
# 【对照来源】参考项目 WindInput/wind_setting（web 配置页）的页面/分区/字段组织与文案；
#   key 必须与本项目 core 的真实配置点路径逐字一致（见 capabilities.snapshot.json）。
# 【分组】group → 页面主体；section → 页内子卡片。
#   前端按 (group, section) 聚合：同 section 的项渲染为一张卡片，section 首次出现序为卡片序，
#   卡片内项序即 items 出现序——故同 section 的项务必相邻声明，且按「基础/开关在前、细节在后」排列。
# 【布局对照表】docs/redesign/settings-layout-correspondence.md
# 【方案页引擎设置】分两级：①全局级（本文件 schema 组「上屏行为/候选行为」，常用通用设置，快捷配置）；
#   ②per-schema 级（方案设置弹窗，后续实现）。
# 【动态可选值】select 项可用 options_source（codetableSchemas/pinyinSchemas/fonts/themes）声明选项来源。


# ── 分组（→ 页面主体）──
[[groups]]
key = "schema"
label = "方案"
order = 1

[[groups]]
key = "input"
label = "输入"
order = 2

[[groups]]
key = "keys"
label = "按键"
order = 3

[[groups]]
key = "ui"
label = "外观"
order = 4

[[groups]]
key = "general"
label = "常规"
order = 5

[[groups]]
key = "advanced"
label = "高级"
order = 6

# ═══════════════════════════ 方案 ═══════════════════════════
# ── 主方案设置 ──
[[items]]
key = "schema.primary_codetable"
group = "schema"
section = "主方案设置"
type = "select"
options_source = "codetableSchemas"               # 选项运行时来自 schema.list（码表类）
label = "主码表方案"
hint = "主力码表方案 id（如 wubi86）；拼音方案的反查/编码提示基于此方案的码表"

[[items]]
key = "schema.primary_pinyin"
group = "schema"
section = "主方案设置"
type = "select"
options_source = "pinyinSchemas"          # 选项运行时来自 schema.list（拼音类）
label = "主拼音方案"
hint = "临时拼音、快捷输入使用的拼音方案（可选双拼）；留空 = 全拼。混输方案的拼音由方案自身配置决定，不受此项影响"

# ── 上屏行为（码表全局基线；方案可经 schema_overrides 覆盖）──
[[items]]
key = "schema.codetable.auto_commit_at_full"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "全码唯一自动上屏"
hint = "唯一精确且无更长后继时直接上屏"

[[items]]
key = "schema.codetable.auto_commit_min_len"
group = "schema"
section = "上屏行为"
type = "number"
label = "自动上屏最短码长"
hint = "0 跟随方案 max_code_length"
min = 0
max = 10
enabled_when = "schema.codetable.auto_commit_at_full == true"
hidden = true

[[items]]
key = "schema.codetable.clear_on_empty_max"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "满码空码清空"
hint = "编码达到最大码长且无候选时自动清空缓冲"

[[items]]
key = "schema.codetable.top_code_commit"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "顶码上屏"
hint = "编码超过最大码长时自动顶字上屏首选"

[[items]]
key = "schema.codetable.punct_commit"
group = "schema"
section = "上屏行为"
type = "toggle"
label = "标点顶码上屏"
hint = "输入标点时自动上屏首选"

[[items]]
key = "schema.codetable.show_code_hint"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "显示编码提示"
hint = "候选旁显示对应编码"

[[items]]
key = "schema.codetable.single_code_input"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "精确匹配模式"
hint = "仅显示精确匹配的候选，不显示前缀匹配"

[[items]]
key = "schema.codetable.single_code_complete"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "精确匹配空码补全"
hint = "精确匹配模式下无候选时，自动从更长编码中取首个候选"
enabled_when = "schema.codetable.single_code_input == true"

[[items]]
key = "schema.codetable.z_key_repeat"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "toggle"
label = "z 键重复输入"
hint = "输入z时首选为上一次上屏的内容，快速重复输入"

# z 的两个身份共用一个键，由 core 在运行时裁决：z_key_repeat 开且有上屏历史、
# 或 z 是本方案的活码前缀时，本项让位（见 core handle_lifecycle.rs 的三重身份裁决）。
# 融合/特殊模式的实例 id 随已安装方案增删，清单只列内置的 quick_mix；配了其他实例的
# 用户，其取值由下拉的「保留当前配置」项兜住，不会在保存时被抹掉。
[[items]]
key = "schema.codetable.z_key_action"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "select"
label = "z 键引导功能"
hint = "z 在本方案是死码时（如五笔 86）可借作引导键，空码状态下按 z 进入所选模式；与「z 键重复输入」冲突时后者优先"
options = [
    { value = "", label = "不启用（作编码字母）" },
    { value = "temp_pinyin", label = "临时拼音" },
    { value = "temp_english", label = "临时英文" },
    { value = "mix:quick_mix", label = "快捷输入" },
]

# 档位取「对哪几级简码生效」，故 core 侧判据是「当前码长 > 档位」而非「等于全码长」——
# 非五笔方案的全码长未必是 4，用码长比较才不必知道方案的最大码长。
# core 支持 1（仅一简），下拉不列：一简位的字本就只有 25 个，单独成档没有实际用途。
[[items]]
key = "schema.codetable.short_code_yield_level"
group = "schema"
section = "上屏行为"
subsection = "常用功能"
type = "number_select"
label = "出简让全"
hint = "有简码的字在更长编码上把首选让给词组，自己排到候选末尾"
width = 160
options = [
    { value = "0", label = "关闭" },
    { value = "2", label = "一、二级简码" },
    { value = "3", label = "全部简码" },
]

# 词频调整
[[items]]
key = "schema.codetable.frequency.enabled"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "toggle"
label = "启用词频调整"
hint = "根据使用频次动态调整候选排序"

[[items]]
key = "schema.codetable.frequency.strategy"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "select"
label = "调频策略"
hint = "置顶：用过一次即到首位；步进：按累计次数上升；位次渐进：每次前移一半位次，逐步靠前"
enabled_when = "schema.codetable.frequency.enabled == true"
options = [
    { value = "top", label = "置顶" },
    { value = "step", label = "步进" },
    { value = "position", label = "位次渐进" },
]

[[items]]
key = "schema.codetable.frequency.promote_prefix"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "select"
label = "补全词参与调频"
hint = "仅「位次渐进」策略下生效。英文等以前缀匹配为主的方案建议选「全部」"
enabled_when = "schema.codetable.frequency.enabled == true && schema.codetable.frequency.strategy == position"
options = [
    { value = "none", label = "不参与" },
    { value = "single", label = "仅单字/单词" },
    { value = "all", label = "全部" },
]

[[items]]
key = "schema.codetable.frequency.half_life"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "number"
label = "热度衰减半衰期"
hint = "使用记录衰减到一半所需的时间，仅「位次渐进」策略下生效。0 = 默认 72 小时"
min = 0
max = 8760
step = 12
unit = "小时"
enabled_when = "schema.codetable.frequency.enabled == true && schema.codetable.frequency.strategy == position"

[[items]]
key = "schema.codetable.frequency.protect_top_n_len1"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "number"
label = "一简位保护前 N 项"
hint = "只输入 1 个编码时（如五笔一简），词典前 N 项不参与调频。一简每个编码通常只有两个字，误选一次就会永久换掉首选，故默认保护"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

[[items]]
key = "schema.codetable.frequency.protect_top_n_len2"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "number"
label = "二简位保护前 N 项"
hint = "输入 2 个编码时，词典前 N 项不参与调频（0 = 不保护）"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

[[items]]
key = "schema.codetable.frequency.protect_top_n_len3"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "number"
label = "三简位保护前 N 项"
hint = "输入 3 个编码时，词典前 N 项不参与调频。默认不保护——三简的固定程度弱于一二简"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

[[items]]
key = "schema.codetable.frequency.protect_top_n"
group = "schema"
section = "上屏行为"
subsection = "词频调整"
type = "number"
label = "全码位保护前 N 项"
hint = "输入 4 个及以上编码时，词典前 N 项不参与调频。默认 0 = 不保护，让调频在全码位正常起作用"
min = 0
max = 100
enabled_when = "schema.codetable.frequency.enabled == true"

# 自动造词
[[items]]
key = "schema.codetable.auto_phrase.enabled"
group = "schema"
section = "上屏行为"
subsection = "自动造词"
type = "toggle"
label = "启用自动造词"
hint = "连续单字上屏后自动组词，存入临时词库（立即可用）"

[[items]]
key = "schema.codetable.auto_phrase.promote_count"
group = "schema"
section = "上屏行为"
subsection = "自动造词"
type = "number"
label = "转入用户词库次数"
hint = "用满几次后永久收录进用户词库；0 = 不收录，一直留在临时词库"
min = 0
max = 20
enabled_when = "schema.codetable.auto_phrase.enabled == true"

# 造词字数上下限（core 有默认 2/10）：隐藏，不对用户开放。
[[items]]
key = "schema.codetable.auto_phrase.min_phrase_len"
group = "schema"
section = "上屏行为"
subsection = "自动造词"
type = "number"
label = "最短造词长度"
hint = "至少连续选几个字才记为词组"
min = 2
max = 10
hidden = true
enabled_when = "schema.codetable.auto_phrase.enabled == true"

[[items]]
key = "schema.codetable.auto_phrase.max_phrase_len"
group = "schema"
section = "上屏行为"
subsection = "自动造词"
type = "number"
label = "最长造词长度"
hint = "最多记录几个字的词组"
min = 2
max = 20
hidden = true
enabled_when = "schema.codetable.auto_phrase.enabled == true"

# ── 候选行为（拼音全局基线；方案可经 schema_overrides 覆盖）──
[[items]]
key = "schema.pinyin.show_code_hint"
group = "schema"
section = "候选行为"
type = "toggle"
label = "显示编码提示"
hint = "拼音候选旁显示对应编码"

[[items]]
key = "schema.pinyin.use_smart_compose"
group = "schema"
section = "候选行为"
type = "toggle"
label = "智能组词"
hint = "根据上下文智能拼接候选"

# 分隔符是所有拼音方案共用的通用项，必须留在本 section 的**无 subsection 区**（即所有
# subsection 标题之前）。对话框渲染遇 subsection=None 不插标题、只是继续排在上一个
# 分组末尾，所以它一旦排到某个 subsection 之后，看起来就成了那个分组的成员。
[[items]]
key = "schema.pinyin.separator"
group = "schema"
section = "候选行为"
type = "select"
label = "拼音分隔符"
hint = "拼音模式下用于消歧的分隔符，如输入 xi'an 得到「西安」；自动模式默认用 '，当 ' 被选择键占用时改用 `"
options = [
  { value = "auto", label = "自动 ( ' / ` )" },
  { value = "quote", label = "单引号 ( ' )" },
  { value = "backtick", label = "反引号 ( ` )" },
  { value = "none", label = "不使用" },
]

# 词频调整
[[items]]
key = "schema.pinyin.frequency.enabled"
group = "schema"
section = "候选行为"
subsection = "词频调整"
type = "toggle"
label = "启用词频调整"
hint = "根据使用频次动态调整候选排序"

[[items]]
key = "schema.pinyin.frequency.promote_prefix"
group = "schema"
section = "候选行为"
subsection = "词频调整"
type = "select"
label = "补全词参与调频"
hint = "只打半个音时（如 d），补全出的候选是否也参与调频。「仅单字」让「的/得」这类单字上浮，但不让「东西」这类词组跑到单字前面"
enabled_when = "schema.pinyin.frequency.enabled == true"
options = [
    { value = "none", label = "不参与" },
    { value = "single", label = "仅单字/单词" },
    { value = "all", label = "全部" },
]

[[items]]
key = "schema.pinyin.frequency.half_life"
group = "schema"
section = "候选行为"
subsection = "词频调整"
type = "number"
label = "热度衰减半衰期"
hint = "使用记录衰减到一半所需的时间。0 = 默认 72 小时"
min = 0
max = 8760
step = 12
unit = "小时"
enabled_when = "schema.pinyin.frequency.enabled == true"

# 词组补全
[[items]]
key = "schema.pinyin.completion.min_syllables"
group = "schema"
section = "候选行为"
subsection = "词组补全"
type = "number"
label = "最少音节数"
hint = "输入达到几个音节才给出词组候选。1 = 不限制，单个字母也给"
min = 1
# 上限 6：出厂值已是 4（对齐 librime/fcitx5 的预测门槛），旧上限 4 会让这个滑块
# 只能往下调、无法比出厂更保守。
max = 6
unit = "个音节"

[[items]]
key = "schema.pinyin.completion.max_extra_syllables"
group = "schema"
section = "候选行为"
subsection = "词组补全"
type = "number"
label = "词组最多超出"
hint = "词组最多比已输入的内容多几个音节。数值越小，候选越贴近已打的字"
min = 0
# 上限 10：与「最少音节数」配合决定召回上限（started + 本项）。出厂 4 + 5 = 9 音节，
# 够多数长成语；要召回更长的用户词（如 11 音节的完整句式）需要调到 7 以上，
# 旧上限 6 够不着。
max = 10
unit = "个音节"

# 自动学习
[[items]]
key = "schema.pinyin.auto_learn.enabled"
group = "schema"
section = "候选行为"
subsection = "自动学习"
type = "toggle"
label = "启用自动学习"
hint = "连续选词后自动将词组加入用户词库"

[[items]]
key = "schema.pinyin.auto_learn.min_word_length"
group = "schema"
section = "候选行为"
subsection = "自动学习"
type = "number"
label = "最短学习词长"
hint = "至少几个字的词组才记录"
min = 2
max = 10
enabled_when = "schema.pinyin.auto_learn.enabled == true"

[[items]]
key = "schema.pinyin.auto_learn.max_word_length"
group = "schema"
section = "候选行为"
subsection = "自动学习"
type = "number"
label = "最长学习词长"
hint = "超过这个字数就不记录；智能组句的长句主要受它约束"
min = 2
max = 20
enabled_when = "schema.pinyin.auto_learn.enabled == true"

# 双拼：allow_full_pinyin 只对双拼方案有意义，但 enabled_when 无法表达「当前方案是双拼」
# （它只能比较配置键），故常驻可见，由 hint 说明适用范围。
[[items]]
key = "schema.pinyin.shuangpin.allow_full_pinyin"
group = "schema"
section = "候选行为"
subsection = "双拼"
type = "toggle"
label = "允许全拼输入"
hint = "双拼方案下也能按全拼打字，如 zaijian → 再见。对全拼方案无影响"

# 辅助码：与「双拼」同理常驻可见——enabled_when 只能比较配置键，表达不出「当前方案是
# 哪种」，而这里的 enabled 本就是**全局基线**，方案段 [engine.aux_code] 的 tri-state 覆盖
# 才是那个方案的真开关（「双拼开、全拼关」正是靠它表达）。
[[items]]
key = "schema.pinyin.aux_code.enabled"
group = "schema"
section = "候选行为"
subsection = "辅助码"
type = "toggle"
label = "启用辅助码"
hint = "打出候选后按触发键，用字形码进一步筛选；触发键需在按键设置里另配"

[[items]]
key = "schema.pinyin.aux_code.max_phrase_len"
group = "schema"
section = "候选行为"
subsection = "辅助码"
type = "number"
label = "参与筛选的最大词长"
hint = "超过这个字数的词组不参与筛选；0 = 不限。单字始终参与"
min = 0
max = 20
enabled_when = "schema.pinyin.aux_code.enabled == true"

# ── 模糊音（拼音对话框内由自定义紧凑网格渲染；列于此供「恢复本页」与覆盖守护）──
