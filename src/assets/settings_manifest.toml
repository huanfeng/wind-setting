group = "schema"
section = "模糊音"
type = "toggle"
label = "启用模糊音"
hint = "勾选下方拼音对，使其互不区分"

[[items]]
key = "schema.pinyin.fuzzy.zh_z"
group = "schema"
section = "模糊音"
type = "toggle"
label = "zh ↔ z"

[[items]]
key = "schema.pinyin.fuzzy.ch_c"
group = "schema"
section = "模糊音"
type = "toggle"
label = "ch ↔ c"

[[items]]
key = "schema.pinyin.fuzzy.sh_s"
group = "schema"
section = "模糊音"
type = "toggle"
label = "sh ↔ s"

[[items]]
key = "schema.pinyin.fuzzy.n_l"
group = "schema"
section = "模糊音"
type = "toggle"
label = "n ↔ l"

[[items]]
key = "schema.pinyin.fuzzy.r_l"
group = "schema"
section = "模糊音"
type = "toggle"
label = "r ↔ l"

[[items]]
key = "schema.pinyin.fuzzy.f_h"
group = "schema"
section = "模糊音"
type = "toggle"
label = "f ↔ h"

[[items]]
key = "schema.pinyin.fuzzy.an_ang"
group = "schema"
section = "模糊音"
type = "toggle"
label = "an ↔ ang"

[[items]]
key = "schema.pinyin.fuzzy.en_eng"
group = "schema"
section = "模糊音"
type = "toggle"
label = "en ↔ eng"

[[items]]
key = "schema.pinyin.fuzzy.in_ing"
group = "schema"
