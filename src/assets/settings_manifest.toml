type = "toggle"
label = "启用简拼"
hint = "只打声母也能出词，如 nh → 你好、bzd → 不知道，也可与全拼混打（nhao）"

# 双拼：allow_full_pinyin 只对双拼方案有意义，但 enabled_when 无法表达「当前方案是双拼」
# （它只能比较配置键），故常驻可见，由 hint 说明适用范围。
[[items]]
key = "schema.pinyin.shuangpin.allow_full_pinyin"
group = "schema"
section = "候选行为"
type = "toggle"
label = "双拼时允许全拼输入"
hint = "双拼方案下也能按全拼打字，如 zaijian → 再见。对全拼方案无影响"

[[items]]
key = "schema.pinyin.frequency.enabled"
group = "schema"
section = "候选行为"
subsection = "学习与扩展"
opens_dialog = "py_freq"
type = "toggle"
label = "词频调整"
hint = "根据使用频次动态调整候选排序"

[[items]]
key = "schema.pinyin.frequency.record_always"
group = "schema"
section = "候选行为"
dialog_group = "py_freq"
type = "toggle"
label = "仅记录次数"
hint = "不调整候选顺序，只记录每个字词的上屏次数，可在词库管理的「词频」中查看和导出。之后若开启词频调整，已记录的次数会立刻参与排序"
enabled_when = "schema.pinyin.frequency.enabled == false"

[[items]]
key = "schema.pinyin.frequency.promote_prefix"
group = "schema"
section = "候选行为"
dialog_group = "py_freq"
type = "select"
label = "补全词参与调频"
hint = "只打半个音时（如 d），补全出的候选是否也参与调频。「仅单字」让「的/得」这类单字上浮，但不让「东西」这类词组跑到单字前面"
enabled_when = "schema.pinyin.frequency.enabled == true"
options = [
  { value = "none", label = "不参与" },
  { value = "single", label = "仅单字/单词" },
  { value = "all", label = "全部" },
]

[[items]]
key = "schema.pinyin.frequency.half_life"
group = "schema"
section = "候选行为"
dialog_group = "py_freq"
type = "number"
label = "热度衰减半衰期"
hint = "使用记录衰减到一半所需的时间。0 = 默认 72 小时"
min = 0
max = 8760
step = 12
unit = "小时"
enabled_when = "schema.pinyin.frequency.enabled == true"

# 自动学习
[[items]]
key = "schema.pinyin.auto_learn.enabled"
group = "schema"
section = "候选行为"
subsection = "学习与扩展"
opens_dialog = "py_auto_learn"
type = "toggle"
label = "自动学习"
hint = "连续选词后自动组词，存入临时词库（立即可用）"

# 与码表侧 schema.codetable.auto_phrase.promote_count 同语义（两边共用 core 的同一套晋升
# 判定），⚠️ 但**出厂值自 2026-09-22 起不同**：码表侧 3，本项仍是 0。分叉的是影响面不是
# 语义——码表侧出厂关闭（只触及主动开启的人），本项出厂就开着（全体用户）。
# 此前只有码表侧暴露，拼音侧学到的词于是永远停在临时词库，而上面那句 hint 还写着
# 「加入用户词库」——用户不手改 config.toml 就没有出路。
[[items]]
key = "schema.pinyin.auto_learn.promote_count"
group = "schema"
section = "候选行为"
dialog_group = "py_auto_learn"
type = "number"
label = "转入用户词库次数"
hint = "用满几次后永久收录进用户词库；0 = 不收录，一直留在临时词库"
min = 0
max = 20
enabled_when = "schema.pinyin.auto_learn.enabled == true"

[[items]]
key = "schema.pinyin.auto_learn.min_word_length"
group = "schema"
section = "候选行为"
dialog_group = "py_auto_learn"
type = "number"
label = "最短学习词长"
hint = "至少几个字的词组才记录"
min = 2
max = 10
enabled_when = "schema.pinyin.auto_learn.enabled == true"

[[items]]
key = "schema.pinyin.auto_learn.max_word_length"
group = "schema"
section = "候选行为"
dialog_group = "py_auto_learn"
type = "number"
label = "最长学习词长"
hint = "超过这个字数就不记录；智能组句的长句主要受它约束"
min = 2
max = 20
enabled_when = "schema.pinyin.auto_learn.enabled == true"

# 辅助码：与「双拼」同理常驻可见——enabled_when 只能比较配置键，表达不出「当前方案是
# 哪种」，而这里的 enabled 本就是**全局基线**，方案段 [engine.aux_code] 的 tri-state 覆盖
# 才是那个方案的真开关（「双拼开、全拼关」正是靠它表达）。
[[items]]
key = "schema.pinyin.aux_code.enabled"
group = "schema"
section = "候选行为"
subsection = "学习与扩展"
opens_dialog = "py_aux"
type = "toggle"
label = "辅助码"
hint = "打出候选后按触发键，用字形码进一步筛选；触发键需在按键设置里另配"

[[items]]
key = "schema.pinyin.aux_code.max_phrase_len"
group = "schema"
section = "候选行为"
dialog_group = "py_aux"
type = "number"
label = "参与筛选的最大词长"
hint = "超过这个字数的词组不参与筛选；0 = 不限。单字始终参与"
min = 0
max = 20
enabled_when = "schema.pinyin.aux_code.enabled == true"

# 直接辅助码：同「启用辅助码」常驻可见——只对双拼生效这件事 enabled_when 表达不了
# （它比较不了「当前方案是哪种」），由 hint 说清；方案段的三态覆盖只在双拼方案里给。
[[items]]
key = "schema.pinyin.aux_code.direct"
group = "schema"
section = "候选行为"
dialog_group = "py_aux"
type = "toggle"
label = "直接辅助码"
hint = "仅双拼：音节后直接敲字形码筛选，不按引导键（如 uidu 再敲 p → 释读）。全拼方案不生效"
enabled_when = "schema.pinyin.aux_code.enabled == true"

# ── 英文候选：与混输/码表同名同义，只是作用于拼音方案 ──
# 本段没有「不自动上屏」一项：那一项否决的是满码上屏/顶码，拼音方案两者都没有。
[[items]]
key = "schema.pinyin.english_merge.enable"
group = "schema"
section = "候选行为"
subsection = "学习与扩展"
opens_dialog = "py_english"
type = "toggle"
label = "英文候选"
hint = "同时查询英文词库并显示英文候选；整串恰好是一个英文词时给它（打 hello 出 hello），无中文候选时按前缀补全"

# 最小触发长度：只约束「中文侧有候选」那一路，见 hint。
[[items]]
key = "schema.pinyin.english_merge.min_length"
group = "schema"
section = "候选行为"
dialog_group = "py_english"
type = "number"
label = "英文最小触发长度"
hint = "有中文候选时，编码达到此长度才查英文（0 = 默认 3）；中文候选为空时不受本项约束，2 码起就给英文补全"
min = 0
max = 10
enabled_when = "schema.pinyin.english_merge.enable == true"

# 词组补全
[[items]]
key = "schema.pinyin.completion.min_syllables"
group = "schema"
section = "候选行为"
subsection = "词组补全"
type = "number"
label = "最少音节数"
hint = "输入达到几个音节才给出词组候选。1 = 不限制，单个字母也给"
min = 1
# 上限 6：出厂值已是 4（对齐 librime/fcitx5 的预测门槛），旧上限 4 会让这个滑块
# 只能往下调、无法比出厂更保守。
max = 6
unit = "个音节"

[[items]]
key = "schema.pinyin.completion.max_extra_syllables"
group = "schema"
section = "候选行为"
subsection = "词组补全"
type = "number"
label = "词组最多超出"
hint = "词组最多比已输入的内容多几个音节。数值越小，候选越贴近已打的字"
min = 0
# 上限 10：与「最少音节数」配合决定召回上限（started + 本项）。出厂 4 + 5 = 9 音节，
# 够多数长成语；要召回更长的用户词（如 11 音节的完整句式）需要调到 7 以上，
# 旧上限 6 够不着。
max = 10
unit = "个音节"

