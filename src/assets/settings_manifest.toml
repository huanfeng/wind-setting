key = "ui.candidate.flip_when_above"
group = "ui"
section = "候选窗口"
type = "toggle"
label = "候选窗在上方时反转候选顺序"
hint = "候选窗显示在光标上方时，反转候选项的排列顺序（使第一候选靠近光标）；可与「编码栏置底」叠加"

[[items]]
key = "ui.candidate.swap_preedit_when_above"
group = "ui"
section = "候选窗口"
type = "toggle"
label = "候选窗在上方时编码栏置底"
hint = "候选窗显示在光标上方时，将编码栏与候选栏上下调换，使编码栏沉到底部贴近光标"

[[items]]
key = "ui.candidate.pager_in_preedit"
group = "ui"
section = "候选窗口"
type = "toggle"
label = "翻页栏并入编码栏"
hint = "将翻页栏右对齐显示在编码栏行（竖排可省一行）；仅「编码显示方式」为「候选窗顶部独立栏」时生效"

[[items]]
key = "ui.candidate.max_chars"
group = "ui"
section = "候选窗口"
type = "number"
label = "候选文本最大字数"
hint = "候选文本超过此字数时截断并追加省略号；0 = 不限"
min = 0
max = 64

[[items]]
key = "ui.candidate.index_labels"
group = "ui"
section = "候选窗口"
type = "dialog_button"
label = "自定义序号标签"
hint = "为序号 1-10 自定义标签字符（如 asdfg）；在对话框中逐框填写，留空用默认 1-9"

# 注：input.cmdbar.enabled（命令栏开关）不在设置端暴露——命令栏始终开启（core 默认 true），
# 不提供关闭入口；故仅保留前缀配置。
[[items]]
key = "input.cmdbar.candidate_prefix"
group = "ui"
section = "候选窗口"
type = "string"
label = "命令栏候选前缀"
hint = "命令候选前的提示符号"

# ── 候选项提示信息 ──
[[items]]
key = "ui.tooltip.delay"
group = "ui"
section = "候选项提示信息"
type = "number"
label = "悬停延时"
hint = "鼠标停留在候选上多久后弹出提示框（毫秒）；越大越不易误触"
min = 0
max = 2000
unit = "ms"

[[items]]
key = "ui.tooltip.code_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "编码反查"
hint = "悬停候选时在主码表中反查该词的标准编码并显示"

[[items]]
key = "ui.tooltip.pinyin_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "拼音反查"
hint = "悬停候选词时显示拼音读音（多音字全部列出）"

[[items]]
key = "ui.tooltip.pinyin_heteronyms"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "显示多音字所有读音"
hint = "关闭则仅显示首音"
enabled_when = "ui.tooltip.pinyin_enabled == true"

# 注：ui.tooltip.pinyin_max_readings（每字最多读音数）当前不支持，已移除（由 core 维持默认）。

[[items]]
key = "ui.tooltip.chaizi_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "拆字反查"
hint = "悬停候选词时显示字根拆字信息（需方案支持）"

[[items]]
key = "ui.tooltip.debug_enabled"
group = "ui"
section = "候选项提示信息"
type = "toggle"
label = "调试信息"
hint = "悬停候选词时显示编码来源、权重等调试元数据"

# ── 状态提示（行为/位置类；纯视觉如颜色/字号/透明度/圆角由主题 theme.toml 处理，不在此）──
[[items]]
key = "ui.status.enabled"
group = "ui"
section = "状态提示"
type = "toggle"
label = "启用状态提示气泡"
hint = "切换输入状态时显示提示气泡"

[[items]]
key = "ui.status.display_mode"
group = "ui"
section = "状态提示"
type = "select"
label = "显示模式"
hint = "临时显示在切换时闪现后自动消失，常驻显示在有输入焦点时始终显示"
enabled_when = "ui.status.enabled == true"
options = [
  { value = "temp", label = "临时显示" },
  { value = "always", label = "常驻显示" },
]

[[items]]
key = "ui.status.duration"
group = "ui"
section = "状态提示"
type = "number"
label = "显示时长"
hint = "临时显示模式下气泡停留时间"
min = 0
max = 5000
unit = "ms"
enabled_when = "ui.status.enabled == true"

[[items]]
key = "ui.status.schema_name_style"
group = "ui"
section = "状态提示"
type = "select"
label = "方案名显示样式"
hint = "状态气泡里方案名用全名或图标短称；图标短称取方案 icon_label，无则回退全名"
options = [
  { value = "full", label = "全名" },
  { value = "short", label = "图标短称" },
]

[[items]]
key = "ui.status.position_mode"
group = "ui"
section = "状态提示"
type = "select"
label = "定位方式"
hint = "跟随光标或固定在自定义位置；偏移与固定坐标在「扩展设置」中调整"
enabled_when = "ui.status.enabled == true"
opens_dialog = "status_position"
options = [
  { value = "follow_caret", label = "跟随光标" },
  { value = "fixed", label = "固定位置" },
]

[[items]]
key = "ui.status.offset_x"
group = "ui"
section = "状态提示"
type = "number"
label = "水平偏移"
hint = "相对光标下方居中的水平偏移（像素，正=右）"
min = -400
max = 400
dialog_group = "status_position"

[[items]]
key = "ui.status.offset_y"
group = "ui"
section = "状态提示"
type = "number"
label = "垂直偏移"
hint = "相对光标下方的垂直偏移（像素，正=下）"
min = -400
max = 400
dialog_group = "status_position"

[[items]]
key = "ui.status.custom_x"
group = "ui"
section = "状态提示"
type = "number"
label = "固定位置 X"
hint = "固定定位时气泡屏幕横坐标（像素）"
min = -4000
max = 4000
enabled_when = "ui.status.position_mode == fixed"
dialog_group = "status_position"

[[items]]
key = "ui.status.custom_y"
group = "ui"
section = "状态提示"
type = "number"
label = "固定位置 Y"
hint = "固定定位时气泡屏幕纵坐标（像素）"
min = -4000
max = 4000
enabled_when = "ui.status.position_mode == fixed"
dialog_group = "status_position"

# ── 模式指示 ──
[[items]]
key = "ui.mode_indicator.style"
group = "ui"
section = "模式指示"
type = "select"
label = "模式指示样式"
hint = "进入临拼/双拼/快符/英文等模式时的标识；短称即 拼/双/快/英/符"
options = [
  { value = "short", label = "短称" },
  { value = "full", label = "全称" },
  { value = "none", label = "不显示" },
]

# ── 工具栏 ──
[[items]]
key = "ui.toolbar.visible"
group = "ui"
section = "工具栏"
type = "toggle"
label = "显示工具栏"
hint = "在屏幕上显示可拖动的输入法状态栏"

[[items]]
key = "ui.toolbar.hide_in_fullscreen"
group = "ui"
section = "工具栏"
type = "toggle"
label = "全屏时隐藏工具栏"
hint = "当前台应用进入全屏（游戏、视频、演示等）时自动隐藏工具栏"

[[items]]
key = "ui.toolbar.auto_hide"
group = "ui"
section = "工具栏"
type = "toggle"
label = "自动隐藏工具栏"
hint = "工具栏显示一段时间无交互后淡出隐藏；鼠标悬停不隐藏，切换中英等状态变化时重新显示"

[[items]]
key = "ui.toolbar.auto_hide_delay"
group = "ui"
section = "工具栏"
type = "number"
label = "自动隐藏延时"
hint = "工具栏显示多久后开始淡出（秒）"
min = 1
max = 60
unit = "s"
enabled_when = "ui.toolbar.auto_hide == true"

# ═══════════════════════════ 常规（并入「输入」页尾「默认状态」）═══════════════════════════
[[items]]
key = "input.default.state_scope"
group = "general"
section = "默认状态"
type = "select"
label = "中英状态作用域"
hint = "全局统一：所有应用共享同一中英状态；按应用独立：每个应用各自记忆中英文（适合游戏等需保持英文的场景，重启输入法后重置）"
options = [
  { value = "global", label = "全局统一" },
  { value = "app", label = "按应用独立" },
]

[[items]]
key = "input.default.remember_last_state"
group = "general"
section = "默认状态"
type = "toggle"
label = "记忆前次状态"
hint = "启用后恢复上次的中英文、全半角和标点状态"

[[items]]
key = "input.default.chinese_mode"
group = "general"
section = "默认状态"
type = "segmented"
label = "初始语言模式"
hint = "每次激活输入法时的默认语言（开启「记忆前次状态」后此项不生效）"
enabled_when = "input.default.remember_last_state == false"
options = [{ value = "false", label = "英文" }, { value = "true", label = "中文" }]

[[items]]
key = "input.default.full_width"
group = "general"
section = "默认状态"
type = "segmented"
label = "初始字符宽度"
hint = "每次激活输入法时的默认字符宽度（开启「记忆前次状态」后此项不生效）"
enabled_when = "input.default.remember_last_state == false"
options = [{ value = "false", label = "半角" }, { value = "true", label = "全角" }]

[[items]]
key = "input.default.chinese_punct"
group = "general"
section = "默认状态"
type = "segmented"
label = "初始标点模式"
hint = "每次激活输入法时的默认标点类型（开启「记忆前次状态」后此项不生效）"
enabled_when = "input.default.remember_last_state == false"
options = [
  { value = "false", label = "英文标点" },
  { value = "true", label = "中文标点" },
]

# ═══════════════════════════ 高级 ═══════════════════════════
# ── 输入统计（统计页未实现期间，开关暂置高级）──
[[items]]
key = "stats.enabled"
group = "advanced"
section = "输入统计"
type = "toggle"
label = "启用输入统计"
hint = "开关输入统计功能"

[[items]]
key = "stats.track_english"
group = "advanced"
section = "输入统计"
type = "toggle"
label = "统计英文输入"
hint = "是否统计英文模式下的输入"
enabled_when = "stats.enabled == true"

# ── 日志设置 ──
[[items]]
key = "debug.log_level"
group = "advanced"
section = "日志设置"
type = "select"
label = "服务日志级别"
hint = "重启输入法服务后生效"
options = [
  { value = "error", label = "error" },
  { value = "warn", label = "warn" },
  { value = "info", label = "info" },
  { value = "debug", label = "debug" },
  { value = "trace", label = "trace" },
]
