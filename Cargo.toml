[package]
name = "wind_setting_native"
version = "0.1.0"
edition = "2024"

[dependencies]
windui = { path = "../wind-ui-rust" }
wind-ipc = { path = "../WindInputPlus/wind_input/crates/wind-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
toml = "0.8"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = []
