[package]
name = "wind_setting"
version = "0.1.0"
edition = "2024"

[dependencies]
windui = { path = "../wind-ui-rust" }
wind-ipc = { path = "../WindInput/wind_input/crates/wind-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
toml = "0.8"
ureq = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = []

[build-dependencies]
# 仅 Windows 目标嵌入图标 / 版本信息 / manifest（DPI 感知），参考 core
winresource = "0.1"

[profile.dev]
# 设置应用在 debug 构建下渲染/布局也需流畅（避免 dev 版卡顿）；
# d2d 加速的是 GPU 呈现，CPU 侧布局/合成靠此优化档。编译稍慢、运行顺滑。
opt-level = 1
