[package]
name = "wind_setting"
version = "0.1.0"
edition = "2024"

[dependencies]
windui = { path = "../wind-ui-rust" }
wind-ipc = { path = "../WindInput/wind_input/crates/wind-ipc" }
serde = { version = "1", features = ["derive"] }
# 用户配置/本机状态目录：与 core（wind-config）同一 crate 同一大版本，
# 保证两边算出的目录在各平台上落到同一处。
dirs = "6"
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "registry"] }
tracing-appender = "0.2"
toml = "0.8"
ureq = "2"
tiny_http = "0.12"
# 升级版本比较：prerelease 与数字标识符的序由规范定义，不自行实现
semver = "1"
# 升级包完整性校验
sha2 = "0.10"

[dev-dependencies]
# 仅测试用：core 的 capability 生成器与配置真相源，供守护 capabilities.snapshot.json
# 与 mockdata/config.json 不与 core 漂移。
# core 仓已因 wind-ipc 成为硬依赖，此处不引入新的路径前提。
wind-rpc = { path = "../WindInput/wind_input/crates/wind-rpc" }
wind-config = { path = "../WindInput/wind_input/crates/wind-config" }
# 标点转换真相源：守护 PUNCT_DEFAULTS（设置页那份四列默认表）不与 core 的转换
# 流水线漂移。漂移的表现是「不动也判脏」，没有堆栈、只能靠这条测试看见。
wind-punct = { path = "../WindInput/wind_input/crates/wind-punct" }
wind-transform = { path = "../WindInput/wind_input/crates/wind-transform" }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[features]
default = []
# 内存诊断：接管全局分配器做净堆计数，并在构建各阶段打点到 %TEMP%\wind_setting_memstat.log。
# 仅排查用，默认关（关闭时打点函数是空实现，优化后不留指令）。
memstat = []

[build-dependencies]
# 仅 Windows 目标嵌入图标 / 版本信息 / manifest（DPI 感知），参考 core
winresource = "0.1"

[profile.dev]
# 设置应用在 debug 构建下渲染/布局也需流畅（避免 dev 版卡顿）；
# d2d 加速的是 GPU 呈现，CPU 侧布局/合成靠此优化档。编译稍慢、运行顺滑。
opt-level = 1

[profile.release]
# 与 cargo 默认同值，显式写出来是为了钉住这个前提：windui 开着 objc2 的 catch-all，
# 靠它把 macOS 上的 Objective-C 异常转成带 name/reason/ObjC 栈的 Rust panic。改成
# "abort" 会让转出来的 panic 落进 nounwind 上下文，崩溃现场退化成一句
# "panic in a function that cannot unwind" —— 正是 WindInput #67 查不动的那种日志。
# 为压体积动这里之前，先读 windui Cargo.toml 里 objc2 依赖处的说明。
panic = "unwind"
